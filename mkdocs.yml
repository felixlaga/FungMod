site_name: FungMod
site_description: Registry-backed mechanistic virtual experiments for fungal and enzyme-mediated substrate degradation.
site_url: https://fungmod.readthedocs.io/
repo_url: https://github.com/felixlaga/FungMod
repo_name: felixlaga/FungMod
edit_uri: edit/main/docs/
copyright: Copyright 2026 FungMod contributors

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Scientific user guide: user-guide.md
  - Core concepts:
      - Virtual experiments: concepts/virtual-experiments.md
      - Outputs and artifacts: concepts/outputs.md
      - Compiled model core: compiled-core.md
      - Organism physiology in the registry: organism-physiology.md
      - Environment response laws: environment-response.md
  - Tutorials:
      - Full example notebooks: notebooks.md
      - Configured models: configured-models.md
  - Capability map: capabilities.md
  - Standards and interoperability: standards.md
  - Calibration evidence: calibration-evidence.md
  - Bayesian calibration and identifiability: bayesian-calibration.md
  - Independent validation: independent-validation.md
  - Culture benchmark: gelain-culture-benchmark.md
  - Joint culture and activity benchmark: gelain-joint-benchmark.md
  - Model criticism study: gelain-model-criticism.md
  - Cross-solver reproduction (PEtab, COPASI): gelain-cross-solver.md
  - Solver and thermodynamic audit: solver-thermodynamic-audit.md
  - Growth and respiration benchmark: respiration-benchmark.md
  - Integrated fungal digestion: degrading-culture.md
  - Experimental data and paper readiness: paper-readiness.md
  - Scientific integrity: scientific-integrity.md
  - Citing FungMod: citing.md
  - API reference: api.md
  - Release notes: release-notes.md

strict: true
