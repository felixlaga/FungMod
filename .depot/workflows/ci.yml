# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per pull request head (or per main push); a newer head cancels the
# older run of the same group instead of queueing behind it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,standards,copasi]"

      - name: Lint
        run: python -m ruff check src tests scripts/run_*.py

      - name: Type check
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        shell: bash

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,standards,copasi]"

      - name: Run tests with coverage
        run: python -m pytest --cov=fungal_model --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml

  documentation:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"

      - name: Build documentation strictly
        run: python -m mkdocs build --strict

  release-notebooks:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[notebooks]"

      - name: Verify deterministic notebook sources
        run: python scripts/build_release_notebooks.py --check

      - name: Execute zero-to-report notebook
        env:
          FUNGMOD_NOTEBOOK_OUTPUT_ROOT: /tmp/fungmod-notebooks
          FUNGMOD_NOTEBOOK_SAMPLES: "2"
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/examples/20_zero_to_complete_virtual_experiment.ipynb
          --output /tmp/fungmod-zero-to-report.ipynb
          --ExecutePreprocessor.timeout=300

      - name: Execute advanced-capabilities notebook
        env:
          FUNGMOD_NOTEBOOK_OUTPUT_ROOT: /tmp/fungmod-notebooks
          FUNGMOD_NOTEBOOK_SAMPLES: "2"
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/examples/21_advanced_capabilities.ipynb
          --output /tmp/fungmod-advanced-capabilities.ipynb
          --ExecutePreprocessor.timeout=300

      - name: Execute five-fungal-enzyme showcase notebook
        env:
          FUNGMOD_NOTEBOOK_OUTPUT_ROOT: /tmp/fungmod-notebooks
          MPLBACKEND: Agg
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/examples/22_five_fungal_beta_glucosidases.ipynb
          --output /tmp/fungmod-five-fungal-beta-glucosidases.ipynb
          --ExecutePreprocessor.timeout=300

  package:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The offline install below uses requirements-lock.txt, generated on
          # CPython 3.13; its pins (numpy 2.5) need Python 3.12 or later.
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Verify packaged resources
        run: python scripts/check_packaged_resources.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel resource identity
        run: python scripts/check_built_distribution_resources.py dist/fungmod-*.whl

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Download the pinned runtime dependencies into a wheelhouse
        run: python -m pip download -r requirements-lock.txt -d wheelhouse

      - name: Install wheel in an isolated environment without network access
        run: |
          python -m venv /tmp/fungmod-wheel-smoke
          /tmp/fungmod-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/fungmod-wheel-smoke/bin/python -m pip install --no-index --find-links wheelhouse dist/fungmod-*.whl

      - name: Run installed-wheel smoke outside the checkout
        working-directory: /tmp
        env:
          MPLBACKEND: Agg
        run: |
          /tmp/fungmod-wheel-smoke/bin/python - <<'PY'
          from pathlib import Path
          import fungmod as fm

          output = Path("/tmp/fungmod-wheel-output")
          study = fm.virtual_experiment(
              fungi="beta-glucosidase source",
              substrates="cellobiose",
              environments="SABIO-RK Reaction 618 selected assay conditions",
          )
          result = study.simulate(
              mode="exploratory",
              n_samples=2,
              seed=618,
              output_dir=output / "reaction_618",
              quicklook=False,
          )
          assert result.final_metrics()
          assert fm.source_proposal(provider="sabiork", reaction_id="618").reaction_records
          configured = fm.run_configured_model(
              fm.example_data_path("model_configs/showcase_dynamic_thermodynamics.yml"),
              output_dir=output / "configured",
          )
          assert configured.solver_metadata["success"] is True
          print(f"fungmod {fm.__version__} installed-wheel smoke passed")
          PY
