kind: dataset_candidate_review
candidate_id: ariaeenejad_2020_persibgl1_cellobiose_hydrolysis
name: Ariaeenejad 2020 PersiBGL1 cellobiose hydrolysis time-course candidate
status: selected_for_schema_review
dataset_maturity: literature_raw
source:
  type: literature
  citation: Ariaeenejad S, Nooshi-Nedamani S, Rahban M, Kavousi K, Pirbalooti AG, Mirghaderi S, Mohammadi M, Mirzaei M, Salekdeh GH. A Novel High Glucose-Tolerant beta-Glucosidase Targeted Computational Approach for Metagenomic Screening. Front Bioeng Biotechnol. 2020;8:813.
  doi: 10.3389/fbioe.2020.00813
  url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
  authors:
    - Shohreh Ariaeenejad
    - Safura Nooshi-Nedamani
    - Mahdie Rahban
    - Kaveh Kavousi
    - Atefeh Ghasemi Pirbalooti
    - SeyedSoheil Mirghaderi
    - Mahsa Mohammadi
    - Mehdi Mirzaei
    - Ghasem Hosseini Salekdeh
  year: 2020
  notes: Open-access Frontiers article reporting a PersiBGL1 cellobiose hydrolysis time course in Figure 6. The article describes cellobiose hydrolysis in 50 mM phosphate buffer at pH 8 and 40 C, but no numeric observation table is included in this review.
intended_use:
  purpose: Candidate source for future beta-glucosidase/cellobiose time-course comparison if Figure 6 can be digitized with explicit axis units, uncertainty policy, extraction provenance, and preprocessing notes.
  measured_quantities:
    - glucose yield over time from cellobiose hydrolysis
  model_targets:
    - beta_D_glucose_concentration
    - cellobiose_concentration
  not_for:
    - immediate data ingestion
    - calibration before Figure 6 is digitized and checked
    - treating PersiBGL1 kinetics as SABIO-RK Reaction 618 evidence
    - whole-fungus degradation claims
    - secretion, uptake, biomass, oxygen, PET, or cellulose morphology models
schema_gate:
  requires_literature_schema: true
  requires_units: true
  requires_uncertainty: true
  requires_preprocessing: true
  requires_no_real_data_in_review: true
review:
  selected_by: FungMod REAL-002E alternate candidate search
  review_date: 2026-06-05
  schema_result: blocked_time_axis_conflict
  decision_notes: Selected as a public open-access alternative because it identifies a specific cellobiose hydrolysis time-course figure and assay conditions. REAL-002F keeps it blocked from ingestion and digitization because source text conflicts on the Figure 6 time axis, no machine-readable observation table was found, Figure 6 has not been digitized, and uncertainty is not defined.
schema_review:
  review_type: literature_metadata_pre_ingestion
  reviewed_by: FungMod REAL-002E alternate-source schema review
  review_date: 2026-06-05
  evidence_checked:
    - Frontiers HTML article at https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
    - Frontiers PDF at https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/pdf
  available_metadata:
    - citation
    - DOI
    - authors
    - year
    - open-access article page
    - enzyme name PersiBGL1
    - substrate cellobiose
    - product glucose yield
    - buffer and pH from method text
    - assay temperature from method text
    - figure identifier Figure 6
    - glucose detection method from method text
  extractable_source:
    figure_or_table: Figure 6
    source_type: figure
    article_caption: Curves indicate the amount of glucose yield in enzymatic hydrolysis of cellobiose with PersiBGL1 after 380 h of biodegradation period.
  missing_for_experiment_dataset:
    - digitized time and glucose-yield rows from Figure 6
    - extraction_method and extraction_tool
    - extracted_by and extraction_date for observation values
    - pixel-to-axis calibration metadata
    - resolved time-axis unit because method/caption use hours while nearby result text also says 380 min
    - raw value units and any unit-conversion notes
    - uncertainty definition for digitized observations
    - preprocessing steps and excluded-point decisions
    - machine-readable observation CSV
  decision: blocked_do_not_ingest
  decision_notes: The source is public and more extractable than the previous blocked candidate, but the repository must not create a literature ExperimentDataset until Figure 6 is digitized with complete provenance and the time-unit inconsistency is resolved.
  next_action: Digitize Figure 6 only if the time axis and value units can be resolved from the article, figure image, or author-supplied data; otherwise continue searching for a table or machine-readable time-course source.
access_review:
  review_type: alternate_public_source_access_check
  reviewed_by: FungMod REAL-002E alternate-source access review
  review_date: 2026-06-05
  sources_checked:
    - name: Frontiers HTML
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
      result: Open-access article page available; method text and Figure 6 identify a cellobiose hydrolysis glucose-yield time course.
    - name: Frontiers PDF
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/pdf
      result: Open-access PDF available; Figure 6 is present, but no machine-readable observation table was identified in the PDF text.
    - name: Supplementary material link
      url: https://www.frontiersin.org/articles/10.3389/fbioe.2020.00813/full#supplementary-material
      result: Supplementary material is linked by the article, but public article text did not identify a machine-readable glucose-yield time-course file.
  access_status: public_full_text_has_digitizable_figure
  full_text_status: open_access_html_and_pdf_available
  supplementary_data_status: no_machine_readable_time_course_identified
  observation_extraction_status: blocked_pending_digitization_and_time_unit_resolution
  decision: select_candidate_for_schema_review_do_not_ingest
  decision_notes: This alternate candidate is public and has a specific Figure 6 time-course target, but it is still not an ingested dataset because no local observation rows, CSV, uncertainty policy, or digitization metadata exist.
  next_action: Perform a dedicated Figure 6 digitization review or keep searching for a source with tabular or downloadable time-course observations.
digitization_review:
  review_type: figure_time_axis_pre_digitization_decision
  reviewed_by: FungMod REAL-002F digitization gate
  review_date: 2026-06-05
  figure_or_table: Figure 6
  sources_checked:
    - name: Frontiers method text
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
      result: Cellobiose hydrolysis method states samples were collected in 24-h intervals until 380 h.
    - name: Frontiers result text
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
      result: Result paragraph states final glucose concentration and says conversion reaches zero after 380 min.
    - name: Frontiers Figure 6 caption
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
      result: Figure 6 caption describes glucose yield after 380 h of biodegradation period.
    - name: Frontiers result follow-up sentence
      url: https://www.frontiersin.org/journals/bioengineering-and-biotechnology/articles/10.3389/fbioe.2020.00813/full
      result: Result paragraph also describes glucose from 1 h to 380 h and little change after 300 h.
  time_axis_resolution: unresolved_source_conflict
  conflict_summary:
    hour_based_evidence:
      - method says 24-h intervals until 380 h
      - Figure 6 caption says 380 h
      - result text says from 1 h to 380 h
      - result text says glucose did not decrease significantly after 300 h
    minute_based_evidence:
      - result text says conversion reaches zero after 380 min
  digitization_status: blocked_do_not_digitize
  experiment_dataset_decision: do_not_create
  decision: blocked_time_axis_conflict_do_not_ingest
  decision_notes: The repository cannot safely digitize Figure 6 or create a literature_raw ExperimentDataset while the source text contains conflicting time-axis units. Choosing hours by majority evidence would be an inference, not source-resolved metadata.
  data_added: none
  next_action: Seek author-supplied raw data, an erratum, a figure image with unambiguous axis labels, or a different source with tabular or machine-readable time-course observations.
notes: Candidate review only. This file intentionally contains no observations, measurement rows, CSV paths, extracted figure data, calibrated parameters, or validation claims.
