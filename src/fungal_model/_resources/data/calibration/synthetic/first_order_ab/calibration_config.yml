kind: calibration_config
name: synthetic first-order A to B calibration
maturity: synthetic
model_config: data/model_configs/synthetic_first_order_calibration.yml
dataset: data/experiments/synthetic/first_order_ab/synthetic_first_order_ab.yml
parameter_symbols:
  - k_ab
initial_guess:
  k_ab: 0.03
bounds:
  k_ab:
    - 0.0
    - 1.0
observable_mapping:
  - dataset_measurement_id: product_mass
    model_observable: released_product_amount
    observable_type: state
    transform: identity
split:
  method: by_time
  train_fraction: 0.7
  validation_fraction: 0.3
outputs:
  directory: outputs/calibration/synthetic_first_order_ab
notes: Synthetic infrastructure fixture only; not empirical evidence.
