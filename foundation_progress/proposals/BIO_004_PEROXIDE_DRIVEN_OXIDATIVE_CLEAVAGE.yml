proposal_kind: bio_mechanism_proposal
milestone_id: BIO-004
mechanism_id: peroxide_driven_oxidative_cleavage
general_process_family: oxidative cleavage of a polysaccharide solid by a copper monooxygenase using hydrogen peroxide
  as co-substrate, with peroxide-dependent inactivation
mathematical_law: 'Kuusk et al. Eq 5: r_cut=kcat*E*S*H/(KiS*KmH+KmH*S+KmS*H+S*H). Eq 4 protection fraction: r_inactive=ki*E*H*KmS/(KmS+S).
  dH/dt=feed-r_cut-k_decay*H; dP/dt=Y*r_cut; dS/dt=-Y*r_cut; dE/dt=-r_inactive; dE_inactive/dt=r_inactive. The primed
  active-enzyme pool and explicit product-per-cut yield are required.'
state_variables:
- name: solid_substrate
  role: substrate
  units: molar monomer-equivalent concentration
- name: hydrogen_peroxide
  role: peroxide
  units: molar concentration
- name: active_monooxygenase
  role: enzyme
  units: molar enzyme concentration
- name: inactive_monooxygenase
  role: inactive_enzyme
  units: molar enzyme concentration
- name: oxidized_products
  role: product
  units: molar monomer-equivalent concentration on the substrate basis
- name: cumulative_cuts
  role: ledger
  units: molar concentration of productive peroxide consumption
- name: cumulative_peroxide_decay
  role: ledger
  units: molar concentration
- name: cumulative_peroxide_feed
  role: ledger
  units: molar concentration
parameters:
- symbol: kcat
  meaning: turnover number with peroxide
  units: per time
- symbol: K_mH
  meaning: half-saturation in peroxide
  units: amount per volume
- symbol: k_in
  meaning: second-order inactivation constant by peroxide
  units: per concentration per time
- symbol: F_H
  meaning: peroxide feed rate
  units: concentration per time
- symbol: k_dH
  meaning: non-productive peroxide decay
  units: per time
- symbol: KmS
  meaning: substrate half-saturation in ternary law and protection fraction
  units: monomer-equivalent amount per volume
- symbol: KiS
  meaning: substrate binding constant in compulsory-order ternary law
  units: monomer-equivalent amount per volume
- symbol: Y
  meaning: sourced monomer-equivalent release per oxidative cut
  units: dimensionless
units:
  state_units_policy: explicit pint-checked units for every state; mass, amount and assay bases are never converted
    silently
  parameter_units_policy: explicit units for every parameter record; a record without units or with incompatible
    units is refused
valid_substrate_classes:
- polysaccharide solids with a confirmed oxidative-cleavage compatibility (cellulose-like and chitin-like first)
valid_enzyme_or_source_classes:
- lytic polysaccharide monooxygenase class, families mapped only where the sourcing gate confirms the substrate
  class
environment_variables:
- name: temperature
  required: false
  units: kelvin
  notes: constants at the condition of their rows
output_curves:
- solid remaining
- peroxide
- active enzyme
- oxidized products
summary_metrics:
- Accumulated oxidative cuts and oxidized-product equivalents.
- Remaining active enzyme and cumulative inactivation.
- Peroxide feed, decay and productive-consumption ledgers.
assumptions:
- The explicit enzyme pool is already primed; reductant is not a state.
- The ternary-complex rate uses finite substrate concentration; no hidden substrate-saturation or bound-enzyme assumption.
- Peroxide is initially present or has a stated constant feed; no in situ generation is inferred.
- Each cut consumes one peroxide; released monomer-equivalents per cut is an explicit sourced coefficient.
- The source does not provide peroxide-damage stoichiometry for the effective inactivation law; no such consumption
  is silently added.
not_in_scope:
- In situ peroxide generation, reductant consumption and enzyme priming kinetics.
- Explicit adsorption occupancy, surface transport and product oxidation-position prediction.
- Oxidative-cut allocation to chain-length populations; no implied M5 chain-end coupling.
- Activity transfer between CAZy families or substrates solely from annotation.
unknowns:
- Preparation-specific kinetic constants, substrate basis and product yield.
- Enzyme-specific activity and substrate specificity beyond conservative class/family annotations.
- A sourced fragment-allocation law for oxidative coupling to finite-chain endo/exo populations.
suggested_experiments:
- Measure oxidized product formation at controlled peroxide feeds.
- Measure residual activity after peroxide exposure with and without substrate.
blocking_failure_modes:
- Missing peroxide state or missing explicit initial concentration.
- Missing peroxide/substrate Michaelis or substrate-binding constants.
- Feed without concentration/time units or source.
- Missing product-yield coefficient or source.
- Unstated inactive-enzyme or cumulative ledger states in the explicit composition.
tests_required:
- Low-peroxide linear and high-peroxide saturating limits; zero peroxide or substrate gives zero cleavage.
- One peroxide per oxidative cut and material, active/inactive enzyme, and feed/decay/peroxide balances.
- Source-derived enzyme decay and integrated total turnover at constant substrate and peroxide.
- Analytic rate gradients versus finite differences with distinct substrate, peroxide and enzyme concentration scales.
- Cellulose-like and chitin-like synthetic cases, without asserting transferred biological constants.
- Complete explicit table-to-configuration assembly, conservation checks, and refusal of missing constants/sources.
limitations:
- Implemented and software-tested with checked law-form evidence; synthetic examples are not calibration or independent
  empirical validation.
- Primed-enzyme, fed-peroxide form; no redox chemistry of reductants.
- No coupling of oxidative cuts to individual finite-chain populations without sourced fragment allocation. No in
  situ peroxide-generation or reductant-priming kinetics.
demo_case:
  case_id: CASE-LPMO-SYNTH
  purpose: Exercise peroxide-driven cleavage on synthetic solids.
  distinction: Synthetic benchmark; not scientific data.
validation_status: software_tested
