proposal_kind: bio_mechanism_proposal
milestone_id: BIO-004
mechanism_id: dissolved_oxygen_balance
general_process_family: dissolved oxygen as a state supplied by gas-liquid transfer and consumed by growth and maintenance
mathematical_law: dO/dt = kLa*(O_sat-O) - nu_O_growth*r_growth - nu_O_maint*r_maint, where r_growth and r_maint
  are volumetric extents that already include biomass X. Uptake capacity is multiplied by O/(K_O+O). O_sat is explicitly
  supplied; no solubility function is implemented.
state_variables:
- name: dissolved_oxygen
  role: oxidant
  units: amount per volume
- name: biomass
  role: biomass
  units: dry mass per volume
- name: oxygen_transferred
  role: signed ledger
  units: amount per volume
- name: oxygen_consumed
  role: nonnegative ledger
  units: amount per volume
parameters:
- symbol: kLa
  meaning: volumetric oxygen transfer coefficient (measured)
  units: per time
- symbol: O_sat
  meaning: dissolved-oxygen saturation
  units: amount per volume
- symbol: nu_O_growth
  meaning: oxygen consumed per unit growth extent
  units: oxygen per biomass
- symbol: nu_O_maint
  meaning: oxygen consumed per maintenance sugar consumed; the volumetric maintenance extent already includes time
    and biomass
  units: oxygen amount per sugar mass or sugar amount
- symbol: K_O
  meaning: oxygen half-saturation of sugar uptake
  units: amount per volume
units:
  state_units_policy: explicit pint-checked units for every state; mass, amount and assay bases are never converted
    silently
  parameter_units_policy: explicit units for every parameter record; a record without units or with incompatible
    units is refused
valid_substrate_classes:
- any culture substrate bound through the closure
valid_enzyme_or_source_classes:
- any aerobic culture whose rows state oxygen stoichiometry and transfer
environment_variables:
- name: temperature
  required: false
  units: kelvin
  notes: constants and explicitly supplied saturation belong to the stated culture condition; temperature-derived
    solubility is not implemented
output_curves:
- dissolved oxygen
- biomass
- oxygen transferred and consumed
summary_metrics:
- minimum dissolved oxygen
- time below a stated oxygen threshold
- oxygen ledger residual
assumptions:
- Well-mixed liquid with one transfer coefficient.
- kLa is a stated measurement; no correlation is used in scientific mode.
not_in_scope:
- kLa correlations from vessel geometry.
- Gas-phase composition dynamics.
- Spatial oxygen gradients in pellets or mycelium.
- Temperature-, pressure- or salinity-derived oxygen solubility; the supplied saturation value is required.
unknowns:
- Oxygen stoichiometry and half-saturation for any particular culture.
suggested_experiments:
- Record dissolved oxygen and the off-gas oxygen uptake rate alongside biomass.
- Measure kLa in the vessel used.
blocking_failure_modes:
- kLa without units of inverse time.
- An oxygen response law with neither a state nor a static value.
- Missing explicitly supplied oxygen saturation, initial oxygen or demand coefficients.
tests_required:
- Analytic approach to saturation without uptake, including signed outgassing from supersaturation.
- Large kLa limit reproduces the oxygen-unlimited closure.
- 'Oxygen ledger: transferred equals consumed plus accumulated.'
- State-driven responses use simulated oxygen and require declared oxygen-unlimited hydrolysis capacity.
limitations:
- Implemented and software-tested with checked law-form evidence; synthetic examples are not calibration or independent
  empirical validation.
- Single well-mixed liquid phase; no gradients.
- Oxygen saturation is explicitly supplied at the medium and condition; no guessed temperature-solubility or salinity
  correction.
demo_case:
  case_id: CASE-OXYGEN-SYNTH
  purpose: Exercise oxygen supply and demand on synthetic cultures.
  distinction: Synthetic benchmark; not scientific data.
validation_status: software_tested
plan_section: foundation_progress/BIO_004_NEW_MECHANISMS_PLAN.md section 7 (M3)
candidate_sources:
- key: garciaochoa2009
  citation: Garcia-Ochoa and Gomez (2009), Biotechnology Advances 27(2):153-176
  supports: 'law form: transfer rate against uptake rate'
  verification: checked 2026-10-09
  doi: 10.1016/j.biotechadv.2008.10.006
- key: benson1984
