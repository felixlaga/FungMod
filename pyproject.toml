[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fungal-model"
version = "0.1.0"
description = "Traceable, unit-aware scientific modelling framework for fungal and enzyme-mediated substrate degradation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FungMod contributors" }
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pint>=0.23",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

