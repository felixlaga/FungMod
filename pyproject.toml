[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fungmod"
version = "0.1.1"
description = "Traceable, unit-aware scientific modelling framework for fungal and enzyme-mediated substrate degradation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Felix Laga", email = "felix.laga@yahoo.com" },
]
maintainers = [
    { name = "Felix Laga", email = "felix.laga@yahoo.com" },
]
keywords = [
    "fungal modelling",
    "enzyme kinetics",
    "mechanistic modelling",
    "scientific computing",
    "virtual experiments",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pint>=0.23",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.5",
    "nbconvert>=7.17",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pyright>=1.1",
    "twine>=7.0",
    "petab>=0.5",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings[python]==1.0.6",
]
notebooks = [
    "jupyter>=1.1",
    "nbconvert>=7.17",
]
standards = [
    "python-libsbml>=5.20",
    "python-libsedml>=2.0",
]

[project.urls]
Documentation = "https://fungmod.readthedocs.io/"
Issues = "https://github.com/felixlaga/FungMod/issues"
Repository = "https://github.com/felixlaga/FungMod"
Releases = "https://github.com/felixlaga/FungMod/releases"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
fungmod = ["py.typed"]
fungal_model = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Optional-dependency tests import after pytest.importorskip, which is E402.
"tests/test_standards_sbml.py" = ["E402"]
"tests/test_standards_sedml_combine.py" = ["E402"]
"tests/test_standards_petab.py" = ["E402"]
"tests/test_standards_biomodels.py" = ["E402"]

[tool.coverage.run]
source = ["fungal_model"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"
