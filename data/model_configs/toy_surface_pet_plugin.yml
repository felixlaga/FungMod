kind: model_config
name: toy surface plugin benchmark
mode: toy
maturity: framework_benchmark
provenance:
  source: FungMod foundation benchmark config; not a scientific case.
  measurement_method: defined software benchmark
  confidence_level: testing
  notes: Exercises generic model-config loading for a plugin-backed surface toy case.
  validity_range: framework tests only
  units: not_applicable
entities:
  fungus:
    id: fungus
    path: data/fungi/toy_pet_fungus.yml
    loader: fungus
  environment:
    id: environment
    path: data/environments/lab_30C_pH7.yml
    loader: environment
  geometry:
    id: geometry
    path: data/geometries/well_mixed_100ml.yml
    loader: well_mixed
  substrates:
    - id: plugin_surface_substrate
      path: data/substrates/pet_film.yml
      loader: pet_plugin
  enzymes:
    - id: surface_active_enzyme
      path: data/enzymes/petase_like.yml
      loader: enzyme
  product_maps:
    - id: plugin_release_map
      path: data/product_maps/toy_surface_plugin_mass_equivalent.yml
      loader: one_to_one
parameters:
  - id: plugin_surface_parameters
    path: data/parameters/pet_surface_benchmark.yml
processes:
  - id: plugin_surface_catalysis
    process_type: surface_catalysis
    states:
      substrate: solid_polymer_amount
      catalyst: free_catalyst_concentration
      product: released_product_amount
    parameters:
      adsorption_constant: K_ads
      surface_rate_constant: k_surface
      accessible_surface_area: A_accessible
    product_map: plugin_release_map
    assumptions:
      - toy plugin benchmark only
initial_state:
  states:
    solid_polymer_amount:
      value: 0.0001
      units: kilogram
    released_product_amount:
      value: 0.0
      units: kilogram
    free_catalyst_concentration:
      value: 1.0
      units: mole / liter
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 20.0
    units: second
  points: 41
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - solid_polymer_amount
      - released_product_amount
      - free_catalyst_concentration
  - id: closed_mass_balance
    validator_type: mass_balance
    conserved_weights:
      solid_polymer_amount: 1.0
      released_product_amount: 1.0
outputs:
  directory: outputs/toy_surface_pet_plugin
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
