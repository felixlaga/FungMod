kind: model_config
name: toy homogeneous A to B benchmark
mode: toy
maturity: framework_benchmark
provenance:
  source: FungMod foundation benchmark config; not a scientific case.
  measurement_method: defined software benchmark
  confidence_level: testing
  notes: Exercises generic model-config loading for a homogeneous toy process.
  validity_range: framework tests only
  units: not_applicable
entities:
  environment:
    id: environment
    path: data/environments/lab_30C_pH7.yml
    loader: environment
  geometry:
    id: geometry
    path: data/geometries/well_mixed_100ml.yml
    loader: well_mixed
  substrates:
    - id: dissolved_substrate
      loader: generic_dissolved
      data:
        kind: substrate
        name: generic dissolved benchmark substrate
        substrate_type: generic_dissolved
        chemical_class: framework benchmark
        physical_state: dissolved
        bond_types: []
        accessible_bonds: []
        required_enzyme_classes: []
        degradation_products:
          - name: generic product B
            notes: Toy product for config loading only.
parameters:
  - id: homogeneous_parameters
    parameters:
      - name: toy first-order conversion constant
        symbol: k_ab
        value: 0.1
        units: 1 / second
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
processes:
  - id: a_to_b
    process_type: first_order
    states:
      source: dissolved_substrate_amount
      product: released_product_amount
    parameters:
      rate_constant: k_ab
    assumptions:
      - toy homogeneous benchmark only
initial_state:
  states:
    dissolved_substrate_amount:
      value: 1.0
      units: kilogram
    released_product_amount:
      value: 0.0
      units: kilogram
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 10.0
    units: second
  points: 11
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - dissolved_substrate_amount
      - released_product_amount
  - id: closed_mass_balance
    validator_type: mass_balance
    conserved_weights:
      dissolved_substrate_amount: 1.0
      released_product_amount: 1.0
outputs:
  directory: outputs/toy_homogeneous_ab
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
