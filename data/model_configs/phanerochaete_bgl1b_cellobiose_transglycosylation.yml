kind: model_config
name: Phanerochaete chrysosporium BGL1B cellobiose hydrolysis and substrate transfer
mode: exploratory
maturity: exploratory
provenance:
  source: https://doi.org/10.1007/s00253-006-0526-z
  measurement_method: Hydrolysis and substrate-transglycosylation constants transcribed from the recombinant BGL1B cellobiose kinetic analysis.
  confidence_level: literature_reported_parameter_estimates
  notes: Source parameters are retained with reported uncertainties; the enzyme dose and time grid are explicit FungMod exploratory scenario choices, not source assay values.
  validity_range: Recombinant intracellular BGL1B acting on cellobiose under the source kinetic-study conditions; not whole-fungus behavior.
  units: not_applicable
entities:
  product_maps:
    - id: bgl1b_cellobiose_hydrolysis
      path: data/product_maps/phanerochaete_bgl1b_cellobiose_hydrolysis.yml
      loader: stoichiometric
    - id: bgl1b_cellobiose_transfer
      path: data/product_maps/phanerochaete_bgl1b_cellobiose_transfer_pool.yml
      loader: stoichiometric
parameters:
  - id: tsukada_2006_bgl1b_cellobiose_kinetics
    parameters:
      - name: BGL1B cellobiose hydrolysis Michaelis constant
        symbol: BGL1B_Km_h
        value: 0.218
        units: millimolar
        uncertainty: 0.017
        source: https://doi.org/10.1007/s00253-006-0526-z
        confidence_level: literature_reported
        notes: Recombinant Phanerochaete chrysosporium BGL1B, cellobiose substrate.
        measurement_method: Nonlinear kinetic analysis reported by Tsukada et al. 2006.
        validity_range: Source cellobiose kinetic assay only.
      - name: BGL1B cellobiose hydrolysis turnover number
        symbol: BGL1B_kcat_h
        value: 16.4
        units: 1 / second
        uncertainty: 0.4
        source: https://doi.org/10.1007/s00253-006-0526-z
        confidence_level: literature_reported
        notes: Recombinant Phanerochaete chrysosporium BGL1B, cellobiose substrate.
        measurement_method: Nonlinear kinetic analysis reported by Tsukada et al. 2006.
        validity_range: Source cellobiose kinetic assay only.
      - name: BGL1B cellobiose substrate-transglycosylation Michaelis constant
        symbol: BGL1B_Km_t
        value: 3.20
        units: millimolar
        uncertainty: 0.69
        source: https://doi.org/10.1007/s00253-006-0526-z
        confidence_level: literature_reported
        notes: Affinity parameter for the second substrate acting as transfer acceptor.
        measurement_method: Coupled hydrolysis/transglycosylation kinetic analysis reported by Tsukada et al. 2006.
        validity_range: Source cellobiose kinetic assay only.
      - name: BGL1B cellobiose substrate-transglycosylation turnover number
        symbol: BGL1B_kcat_t
        value: 8.77
        units: 1 / second
        uncertainty: 1.65
        source: https://doi.org/10.1007/s00253-006-0526-z
        confidence_level: literature_reported
        notes: Turnover parameter for the second-substrate transfer branch.
        measurement_method: Coupled hydrolysis/transglycosylation kinetic analysis reported by Tsukada et al. 2006.
        validity_range: Source cellobiose kinetic assay only.
processes:
  - id: bgl1b_cellobiose_hydrolysis
    process_type: substrate_transglycosylation
    branch: hydrolysis
    primary_source: https://doi.org/10.1007/s00253-006-0526-z
    maturity: literature_backed_software_tested
    states:
      substrate: cellobiose_concentration
      enzyme: bgl1b_concentration
    parameters:
      hydrolysis_km: BGL1B_Km_h
      transglycosylation_km: BGL1B_Km_t
      hydrolysis_kcat: BGL1B_kcat_h
      transglycosylation_kcat: BGL1B_kcat_t
      rate_units: millimolar / second
    product_map: bgl1b_cellobiose_hydrolysis
    assumptions:
      - source point estimates apply to the explicit exploratory enzyme-dose scenario without refitting
  - id: bgl1b_cellobiose_substrate_transfer
    process_type: substrate_transglycosylation
    branch: transglycosylation
    primary_source: https://doi.org/10.1007/s00253-006-0526-z
    maturity: literature_backed_software_tested
    states:
      substrate: cellobiose_concentration
      enzyme: bgl1b_concentration
    parameters:
      hydrolysis_km: BGL1B_Km_h
      transglycosylation_km: BGL1B_Km_t
      hydrolysis_kcat: BGL1B_kcat_h
      transglycosylation_kcat: BGL1B_kcat_t
      rate_units: millimolar / second
    product_map: bgl1b_cellobiose_transfer
    assumptions:
      - the second cellobiose molecule is the transfer acceptor
      - unresolved transfer products are represented as a three-glucose-unit pool without linkage assignment
initial_state:
  states:
    cellobiose_concentration:
      value: 10.0
      units: millimolar
    bgl1b_concentration:
      value: 0.001
      units: millimolar
    glucose_concentration:
      value: 0.0
      units: millimolar
    cellobiose_derived_trisaccharide_concentration:
      value: 0.0
      units: millimolar
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 600.0
    units: second
  points: 241
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - cellobiose_concentration
      - bgl1b_concentration
      - glucose_concentration
      - cellobiose_derived_trisaccharide_concentration
  - id: glucose_equivalent_balance
    validator_type: mass_balance
    conserved_weights:
      cellobiose_concentration: 2.0
      glucose_concentration: 1.0
      cellobiose_derived_trisaccharide_concentration: 3.0
outputs:
  directory: outputs/phanerochaete_bgl1b_cellobiose_transglycosylation
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
