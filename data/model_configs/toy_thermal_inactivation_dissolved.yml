kind: model_config
name: toy thermal inactivation benchmark
mode: toy
maturity: framework_benchmark
provenance:
  source: FungMod foundation benchmark config; not a scientific case.
  measurement_method: defined software benchmark
  confidence_level: testing
  notes: >
    Exercises the generic thermal_inactivation process in a non-biological
    dissolved setting: an active pool is lost to an inactive pool at a
    first-order rate whose constant follows the Arrhenius reference form in the
    environment temperature. Units are molar and seconds so that no enzyme,
    organism, or culture interpretation is implied.
  validity_range: framework tests only
  units: not_applicable
entities:
  environment:
    id: environment
    path: data/environments/lab_30C_pH7.yml
    loader: environment
  geometry:
    id: geometry
    path: data/geometries/well_mixed_100ml.yml
    loader: well_mixed
  substrates:
    - id: dissolved_active_pool
      loader: generic_dissolved
      data:
        kind: substrate
        name: generic dissolved benchmark active pool
        substrate_type: generic_dissolved
        chemical_class: framework benchmark
        physical_state: dissolved
        bond_types: []
        accessible_bonds: []
        required_enzyme_classes: []
        degradation_products:
          - name: generic inactive pool
            notes: Toy product for config loading only.
parameters:
  - id: inactivation_parameters
    parameters:
      - name: toy reference inactivation constant
        symbol: k_d_ref_toy
        value: 0.01
        units: 1 / second
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy inactivation energy
        symbol: E_d_toy
        value: 60.0
        units: kilojoule / mole
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy reference temperature
        symbol: T_ref_toy
        value: 298.15
        units: kelvin
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
processes:
  - id: active_pool_inactivation
    process_type: thermal_inactivation
    states:
      active: active_concentration
      inactive: inactive_concentration
    parameters:
      reference_rate_constant: k_d_ref_toy
      inactivation_energy: E_d_toy
      reference_temperature: T_ref_toy
    assumptions:
      - toy first-order Arrhenius thermal inactivation benchmark only
initial_state:
  states:
    active_concentration:
      value: 1.0
      units: millimolar
    inactive_concentration:
      value: 0.0
      units: millimolar
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 120.0
    units: second
  points: 25
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - active_concentration
      - inactive_concentration
  - id: pool_mass_balance
    validator_type: mass_balance
    conserved_weights:
      active_concentration: 1.0
      inactive_concentration: 1.0
outputs:
  directory: outputs/toy_thermal_inactivation_dissolved
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
