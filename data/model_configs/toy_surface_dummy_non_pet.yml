kind: model_config
name: toy dummy non-PET surface benchmark
mode: toy
maturity: framework_benchmark
provenance:
  source: FungMod foundation benchmark config; not a scientific case.
  measurement_method: defined software benchmark
  confidence_level: testing
  notes: Exercises generic surface config loading on a non-PET dummy substrate.
  validity_range: framework tests only
  units: not_applicable
entities:
  environment:
    id: environment
    path: data/environments/lab_30C_pH7.yml
    loader: environment
  geometry:
    id: geometry
    path: data/geometries/well_mixed_100ml.yml
    loader: well_mixed
  substrates:
    - id: dummy_solid
      loader: generic_solid
      data:
        kind: substrate
        name: inert dummy solid benchmark
        substrate_type: generic_solid
        chemical_class: framework benchmark
        physical_state: mixed_solid
        bond_types:
          - generic_linkage
        accessible_bonds:
          - generic_linkage
        required_enzyme_classes: []
        degradation_products:
          - name: released generic product
            notes: Toy product for config loading only.
  product_maps:
    - id: dummy_release_map
      path: data/product_maps/toy_surface_dummy_mass_equivalent.yml
      loader: one_to_one
parameters:
  - id: dummy_surface_parameters
    parameters:
      - name: toy adsorption equilibrium constant
        symbol: K_ads_dummy
        value: 1.0
        units: liter / mole
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy surface catalysis constant
        symbol: k_surface_dummy
        value: 0.000001
        units: kilogram / meter ** 2 / second
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy accessible surface area
        symbol: A_dummy
        value: 0.2
        units: meter ** 2
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
processes:
  - id: dummy_surface_catalysis
    process_type: surface_catalysis
    states:
      substrate: solid_substrate_amount
      catalyst: free_catalyst_concentration
      product: released_product_amount
    parameters:
      adsorption_constant: K_ads_dummy
      surface_rate_constant: k_surface_dummy
      accessible_surface_area: A_dummy
    product_map: dummy_release_map
    assumptions:
      - toy surface benchmark only
initial_state:
  states:
    solid_substrate_amount:
      value: 0.0001
      units: kilogram
    released_product_amount:
      value: 0.0
      units: kilogram
    free_catalyst_concentration:
      value: 1.0
      units: mole / liter
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 20.0
    units: second
  points: 41
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - solid_substrate_amount
      - released_product_amount
      - free_catalyst_concentration
  - id: closed_mass_balance
    validator_type: mass_balance
    conserved_weights:
      solid_substrate_amount: 1.0
      released_product_amount: 1.0
outputs:
  directory: outputs/toy_surface_dummy_non_pet
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
