kind: model_config
name: toy producer-proportional induced synthesis benchmark
mode: toy
maturity: framework_benchmark
provenance:
  source: FungMod foundation benchmark config; not a scientific case.
  measurement_method: defined software benchmark
  confidence_level: testing
  notes: >
    Exercises the generic proportional_synthesis process in a non-biological
    dissolved setting: a producer pool forms a product pool, saturably induced
    by a separate inducer pool that is consumed only by an independent
    first-order loss. Units are molar and seconds so that no organism, enzyme
    activity, or culture interpretation is implied.
  validity_range: framework tests only
  units: not_applicable
entities:
  environment:
    id: environment
    path: data/environments/lab_30C_pH7.yml
    loader: environment
  geometry:
    id: geometry
    path: data/geometries/well_mixed_100ml.yml
    loader: well_mixed
  substrates:
    - id: dissolved_inducer
      loader: generic_dissolved
      data:
        kind: substrate
        name: generic dissolved benchmark inducer
        substrate_type: generic_dissolved
        chemical_class: framework benchmark
        physical_state: dissolved
        bond_types: []
        accessible_bonds: []
        required_enzyme_classes: []
        degradation_products:
          - name: generic inducer loss product
            notes: Toy product for config loading only.
parameters:
  - id: synthesis_parameters
    parameters:
      - name: toy specific production rate
        symbol: q_toy
        value: 0.02
        units: millimolar / second / millimolar
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy induction half-saturation constant
        symbol: K_ind_toy
        value: 0.5
        units: millimolar
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
      - name: toy inducer loss constant
        symbol: k_loss_toy
        value: 0.05
        units: 1 / second
        uncertainty: 0.0
        source: FungMod foundation benchmark config.
        confidence_level: testing
        notes: Artificial value for config loading only.
        measurement_method: defined benchmark value
        validity_range: framework tests only
processes:
  - id: induced_product_formation
    process_type: proportional_synthesis
    states:
      producer: producer_concentration
      inducer: inducer_concentration
      product: product_concentration
    parameters:
      specific_rate: q_toy
      induction_half_saturation: K_ind_toy
      rate_units: millimolar / second
    assumptions:
      - toy producer-proportional induced synthesis benchmark only
  - id: inducer_loss
    process_type: first_order
    states:
      source: inducer_concentration
      product: inducer_loss_product_concentration
    parameters:
      rate_constant: k_loss_toy
    assumptions:
      - toy first-order inducer loss benchmark only
initial_state:
  states:
    producer_concentration:
      value: 2.0
      units: millimolar
    inducer_concentration:
      value: 1.0
      units: millimolar
    product_concentration:
      value: 0.0
      units: millimolar
    inducer_loss_product_concentration:
      value: 0.0
      units: millimolar
time:
  start:
    value: 0.0
    units: second
  stop:
    value: 60.0
    units: second
  points: 31
validators:
  - id: non_negative_states
    validator_type: non_negative
    species:
      - producer_concentration
      - inducer_concentration
      - product_concentration
      - inducer_loss_product_concentration
  - id: inducer_mass_balance
    validator_type: mass_balance
    conserved_weights:
      inducer_concentration: 1.0
      inducer_loss_product_concentration: 1.0
outputs:
  directory: outputs/toy_proportional_synthesis_dissolved
  save:
    - record
    - validation_report
  plots:
    - state_trajectories
