processes:
- id: a_to_b
  process_type: first_order
  states:
    source: dissolved_substrate_amount
    product: released_product_amount
  parameters:
    rate_constant: k_ab
  assumptions:
  - toy homogeneous benchmark only
  modifiers:
  - type: ph_gaussian
    optimum_symbol: optimum
    width_symbol: width
    source: Artificial response; not biological measurements.
    state_source: ph
- id: medium_ph_a_to_b
  process_type: proton_balance_ph
  states:
    ph: ph
    output: ph
  parameters:
    buffers: &id001
    - concentration: medium_0
      pka: medium_1
    proton_coefficient: medium_8
    water_ion_product: medium_5
    standard_concentration: medium_6
    temperature: medium_7
  driver:
    id: a_to_b
    process_type: first_order
    states:
      source: dissolved_substrate_amount
      product: released_product_amount
    parameters:
      rate_constant: k_ab
    assumptions:
    - toy homogeneous benchmark only
    modifiers:
    - type: ph_gaussian
      optimum_symbol: optimum
      width_symbol: width
      source: Artificial response; not biological measurements.
      state_source: ph
  balance:
    concentration_units: mol/L
    time_units: hour
    ph_bounds: &id002
    - 2.0
    - 12.0
    source: 'doi:10.1021/ed074p937; proton coefficient: Synthetic numerical benchmark;
      no empirical measurements.'
    mode: ph
- id: medium_proton_ledger_a_to_b
  process_type: proton_balance_ph
  states:
    ph: ph
    output: proton_ledger
  parameters:
    buffers: *id001
    proton_coefficient: medium_8
    water_ion_product: medium_5
    standard_concentration: medium_6
    temperature: medium_7
  driver:
    id: a_to_b
    process_type: first_order
    states:
      source: dissolved_substrate_amount
      product: released_product_amount
    parameters:
      rate_constant: k_ab
    assumptions:
    - toy homogeneous benchmark only
    modifiers:
    - type: ph_gaussian
      optimum_symbol: optimum
      width_symbol: width
      source: Artificial response; not biological measurements.
      state_source: ph
  balance:
    concentration_units: mol/L
    time_units: hour
    ph_bounds: *id002
    source: 'doi:10.1021/ed074p937; proton coefficient: Synthetic numerical benchmark;
      no empirical measurements.'
    mode: proton_ledger
initial_state:
  states:
    dissolved_substrate_amount:
      value: 0.01
      units: mol/L
    released_product_amount:
      value: 0.0
      units: mol/L
    ph:
      value: 7.0
      units: dimensionless
      domain: signed
      lower_bound: 2.0
      upper_bound: 12.0
    proton_ledger:
      value: 0.0
      units: mol/L
      domain: signed
time:
  start:
    value: 0.0
    units: hour
  stop:
