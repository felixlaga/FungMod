equations:
- id: saturation
  location: pp. 383-384, equation (2)
  expression: r = r_max C / (K + C)
  interpretation: Single-resource saturation; using the saturation form for uptake
    capacity is an explicit effective-model assumption.
study_system: Bacterial cultures; no fungus-specific constants transferred.
assumptions:
- Well-mixed population under fixed conditions.
- One limiting resource; optional independent oxidant saturation is a model composition.
validity:
- Concentrations nonnegative, K positive.
limitations:
- Supports a law form only, not fungal uptake constants, yield, or validation.
