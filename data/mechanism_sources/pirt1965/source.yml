    full text not accessible in this intake.
  expression: q = mu / Y_true + m
  interpretation: Algebraic expression of the abstract-described constant maintenance
    requirement and true growth yield; mu=Y_true max(q-m,0) with maintenance capped
    at q is the explicitly declared nonnegative model extension.
study_system: Growing bacterial cultures; maintenance/yield law form only.
assumptions:
- Maintenance demand is constant per biomass at a stated condition.
- Below demand, uptake pays maintenance and biomass formation is zero.
validity:
- Positive true yield; nonnegative uptake and maintenance.
limitations:
- Only bibliographic record and publisher abstract verified; no equation number or
