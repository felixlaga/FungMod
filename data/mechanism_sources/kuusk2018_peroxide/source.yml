source_id: kuusk2018_peroxide
citation: Kuusk et al. (2018), Kinetics of H2O2-driven degradation of chitin by a bacterial lytic polysaccharide monooxygenase, Journal of Biological Chemistry 293(2), 523-531.
doi: 10.1074/jbc.M117.817593
url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5767858/
license: 'Copyright ASBMB; bibliographic metadata and mathematical transcription only; no full article redistributed.'
retrieved_on: '2026-10-09'
supports: [law_form]
equations:
  - id: oxidative_cleavage
    location: Equation 5 and Figure 8
    expression: 'r_cut = kcat*E*S*H / (KiS*KmH + KmH*S + KmS*H + S*H)'
    interpretation: 'Compulsory-order ternary-complex rate. E is the active primed enzyme pool; its inactivation is integrated explicitly rather than multiplying by the paper transient exponential. Product release is an explicit sourced monomer-equivalent yield times r_cut.'
  - id: peroxide_inactivation
    location: Equation 4, Figure 6 and Equation 5 exponential
    expression: 'r_inactive = ki*E*H*KmS/(KmS+S)'
    interpretation: 'Second-order free-enzyme inactivation with the measured substrate protection fraction. Active plus inactive enzyme is conserved. This is the paper reduced effective law, not a universal oxidative-damage mechanism.'
  - id: peroxide_ledger
    location: Figure 8 legend and section Stoichiometry of H2O2-driven degradation
    expression: 'dH/dt = feed - r_cut - decay; dP/dt = yield*r_cut; dS/dt = -yield*r_cut'
    interpretation: 'One H2O2 per oxidative cut; released monomer-equivalents per cut is a separate parameter. The paper does not specify a peroxide consumption stoichiometry for inactivation, so none is silently added.'
study_system: 'Primed Serratia marcescens CBP21 acting on chitin nanowhiskers with externally supplied H2O2.'
assumptions:
  - 'Enzyme is already reductively primed; no explicit reductant or O2 route.'
  - 'Total active enzyme partitions between bound/protected and free susceptible populations by the reduced law in Eq 4.'
  - 'Substrate and products use the same explicit monomer-equivalent basis; the product yield is not assumed to equal one.'
validity:
  - 'Positive KmH, KmS and KiS; nonnegative active enzyme, substrate and peroxide; constants require preparation-specific provenance.'
  - 'Cellulose-like synthetic tests demonstrate reuse, not parameter transfer or independent validation.'
limitations:
  - 'Only explicit peroxide feed and stated first-order peroxide decay; no in situ peroxide generation.'
  - 'Substrate accessibility, oxidation position and product solubility are not predicted.'
  - 'No unsourced oxidative-cut allocation to individual chain lengths. Coupling to finite-chain endo/exo requires independently sourced fragment allocation.'
