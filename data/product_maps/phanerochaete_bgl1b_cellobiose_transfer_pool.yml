kind: product_map
name: Phanerochaete BGL1B cellobiose substrate-transfer branch
product_map_type: stoichiometric
maturity: literature_backed_software_tested
provenance:
  source: https://doi.org/10.1007/s00253-006-0526-z
  measurement_method: Substrate-transglycosylation branch stoichiometry from the reported retaining-glycosidase kinetic scheme.
