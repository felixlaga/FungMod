kind: experiment_dataset
dataset_id: alvarez_gonzalez_2022_free_beta_glucosidase_cellobiose_20gl_v1
name: Alvarez-Gonzalez 2022 free beta-glucosidase cellobiose time course
maturity: literature_raw

source:
  type: literature
  citation: Alvarez-Gonzalez C, Santos VE, Ladero M, Bolivar JM. Immobilization-Stabilization of beta-Glucosidase for Implementation of Intensified Hydrolysis of Cellobiose in Continuous Flow Reactors. Catalysts. 2022;12(1):80.
  doi: 10.3390/catal12010080
  url: https://www.mdpi.com/2073-4344/12/1/80
  authors:
    - Celia Alvarez-Gonzalez
    - Victoria E. Santos
    - Miguel Ladero
    - Juan M. Bolivar
  year: 2022
  figure_or_table: Supplementary Figure S1, panel A, filled-square series
  extraction_method: Raster figure digitization from the publisher supplementary PDF
  extraction_tool: pypdfium2 5.12.1 render at scale 3 plus exact-color square-centre extraction reviewed against the rendered page
  extracted_by: OpenAI Codex for FungMod
  extraction_date: 2026-08-01
  raw_units:
    time: minute
    value: millimolar
    uncertainty: millimolar
  notes: The supplement is CC BY. Only the filled-square 20 g/L series in panel A was digitized. The plotted means are used; the paper does not define the plotted error bars as SD, SE, or another statistic.

system:
  organism: null
  enzyme: Commercial beta-glucosidase 1000 formulation donated by ASA Spezialenzyme GmbH
  substrate: cellobiose
  product: glucose
  environment: 50 mM sodium citrate buffer at pH 5.0
  geometry: well_mixed batch reactor
  notes: The 2022 source does not directly state the biological source organism of the commercial formulation, so no organism label is assigned.

conditions:
  temperature:
    value: 50.0
    units: degree_Celsius
  ph:
    value: 5.0
    units: dimensionless
  volume:
    value: 20.0
    units: milliliter
  agitation:
    value: 120.0
    units: revolutions_per_minute
  nominal_initial_cellobiose:
    value: 20.0
    units: gram / liter
  free_enzyme_concentration:
    value: 59.2
    units: milligram / liter
  sampling_times:
    values: [0, 5, 10, 15, 20, 30, 40, 50, 60]
    units: minute
  notes: Conditions are transcribed from Supplementary Figure S1 and Materials and Methods section 3.6.1.

measurements:
  - id: cellobiose_concentration
    measured_quantity: cellobiose concentration remaining
    observable_type: state
    data_file: alvarez_gonzalez_2022_figure_s1a_filled_squares.csv
    time_column: time_min
    value_column: cellobiose_millimolar
    uncertainty_column: digitization_uncertainty_millimolar
    units:
      time: minute
      value: millimolar
      uncertainty: millimolar
    uncertainty_type: estimated digitization error, not experimental uncertainty
    censoring: none
    replicate_id_column: null
    notes: Values are digitized plotted means. The uniform uncertainty is the extraction resolution only and must not be interpreted as biological or analytical variability.

measurement_definitions:
  measured_quantity: Cellobiose concentration remaining in the batch reactor
  units: millimolar
  uncertainty_definition: Uniform 0.6 mM estimated digitization error from approximately one rendered pixel on the calibrated y axis; experimental uncertainty is unavailable because the error-bar statistic is not defined in the source.
  measurement_method: Source samples were acid-quenched and cellobiose was quantified by HPLC with a Rezex H+ column and refractive-index detection.

preprocessing:
  status: raw_figure_digitization
  raw_data_available: false
  steps:
    - downloaded the publisher supplementary ZIP and verified the extracted PDF SHA-256
    - rendered supplementary PDF page 5 at scale 3 with pypdfium2 5.12.1
    - calibrated the y axis from pixel row 724 at 0 mM to pixel row 284 at 240 mM
    - used the source-listed sampling times and extracted centres of the filled green square markers
    - converted marker-centre pixel rows to millimolar without smoothing, fitting, baseline correction, or normalization
  unit_conversions:
    - y_mM = (724 - y_pixel) * 240 / 440
    - no conversion was applied to the source time values
  excluded_points: []
  notes: The nominal 20 g/L starting condition was not substituted for the plotted t=0 observation. Curves and the 70 g/L open-square series were not digitized.

digitization:
  software: pypdfium2 5.12.1 and Pillow 12.2.0 exact RGB marker inspection
  source_page: Supplementary PDF page 5
  source_series: Figure S1A filled green squares
  axis_calibration:
    x_axis: Sampling times 0, 5, 10, 15, 20, 30, 40, 50, and 60 min from Methods section 3.6.1
    y_axis: 0 mM at rendered pixel row 724 and 240 mM at row 284
    rendered_page_size_pixels: 1786 x 2526
    render_scale: 3
  estimated_digitization_error:
    value: 0.6
    units: millimolar
    basis: Approximately one rendered y pixel; the calibrated scale is 0.545 mM per pixel.
  included_points: 9
  excluded_points: []
  exclusion_reason: No points excluded from the selected series.

supplementary_data:
  file_name: catalysts-1506763-supplementary.pdf
  source_url_or_doi: https://mdpi-res.com/d_attachment/catalysts/catalysts-12-00080/article_deploy/catalysts-12-00080-s001.zip
  checksum: sha256:212683610102dcf0a6200bdad715d2ffc95f5e7802b7f94d20f8330c34401b55
  access_date: 2026-08-01
  notes: The repository stores the extracted observations and provenance, not a duplicate of the publisher PDF.

validation:
  expected_columns:
    - time_min
    - cellobiose_millimolar
    - digitization_uncertainty_millimolar
    - marker_center_x_pixel
    - marker_center_y_pixel
  allow_missing_uncertainty: false

notes: Literature-raw digitization suitable for model comparison, not parameter calibration or a general validation claim. It describes a purified commercial enzyme formulation, not whole-fungus physiology.
