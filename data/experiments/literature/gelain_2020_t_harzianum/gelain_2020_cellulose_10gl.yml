- id: substrate
  measured_quantity: cellulose concentration
  observable_type: state
  data_file: gelain_2020_cellulose_10gl.csv
  time_column: time_h
  value_column: substrate_g_l
  uncertainty_column: null
  units:
    time: hour
    value: gram / liter
    uncertainty: null
  uncertainty_type: 'unknown: individual duplicates and SD not deposited'
  censoring: unknown; recorded zeros retained
  replicate_id_column: null
  notes: Published duplicate means, not individual replicates. See source_row for cell traceability.
measurement_definitions:
  measured_quantity: Culture biomass and remaining substrate concentration
  units: gram / liter
  uncertainty_definition: Unavailable in deposited experimental workbooks; paper uses duplicate means
    and plots sample SD. No SD or replicate measurements invented.
  measurement_method: 'Article Methods 2.3: glycerol by HPLC; cellulose and mycelium according to Ahamed
    and Vermette (2009). Biomass/substrate separation and assay details require review before fitting.'
preprocessing:
  status: machine_readable_mean_extraction
  raw_data_available: false
  steps:
  - Verify source SHA-256
  - Read Plan1 stored cells without executing formulas
  - Retain numeric values and time labels
  - Separate t=0 source initial conditions
  - Import only biomass and substrate into ExperimentDataset
  unit_conversions:
  - None; h to hour and g/L to gram / liter are unit-label expansions only
  excluded_points:
  - t=0 entries are source initial conditions, retained in source intake, not fitting observations
  notes: No smoothing, error reconstruction, inferred replicates, or fitting. Activity values remain in
    source intake in FPU/L and U/L, pending assay-specific observation operators. All six conditions were
    used for estimation in the source publication; none is independent external validation.
supplementary_data:
  file_name: gelain_2020/originals/cellulose/10gL.xlsx
  source_url_or_doi: https://doi.org/10.17632/shd3wcczsr.2
  checksum: sha256:142eb8649ccf08d4de1df9c6dbe69ca53d3887f7817b4b3b1979c144fcd483f7
  access_date: '2026-09-28'
  notes: Original file preserved under data/experiments/source_intake; full archive and article also preserved.
validation:
  expected_columns:
  - time_h
  - source_row
  - biomass_g_l
  - substrate_g_l
  allow_missing_uncertainty: true
notes: Exploratory whole-culture data for one strain, not a validated fungal model. Cannot pass the independent
  raw-replicate evidence gate. Source zeros are not assumed exact measurements.
