    sd_one_sided: 460
    sd_from_one_panel: 60
    marker_partially_hidden: 374
    sd_unavailable: 61
    single_panel: 39
    panel_disagreement: 2
    sd_asymmetric_bar: 10
  flag_glossary:
    marker_partially_hidden: less than 85 percent of the marker disc is visible behind another series;
      position uncertainty widened to two pixels
    sd_asymmetric_bar: both bar caps visible but their distances from the marker centre differ by more
      than two pixels; the mean half-length is stored
    sd_one_sided: only one bar cap is visible; the standard deviation is that half-length
    sd_below_marker_radius: the bar does not reach beyond the marker disc, so the standard deviation is
      smaller than the marker radius and is left empty
    sd_unavailable: neither bar cap is visible; the standard deviation is left empty
    single_panel: the marker was found in only one of the two panels that plot this condition
    panel_disagreement: the two panels differ by more than three pixels of the coarser panel; the mean
      is stored and the difference is recorded
    sd_from_one_panel: the standard deviation could be read in only one of the two panels
