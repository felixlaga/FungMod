notes: Literature-processed colony growth curves of Coniophora puteana MUCL 11662 (mycelial area) over
  a temperature-humidity grid, extracted for the spatial mycelium core. They support calibration and held-out
  prediction across conditions within one study under a frozen plan; they do not validate any model on
  their own, do not transfer to submerged culture or other strains, and the area and tip count need a
  declared observation operator before comparison with hyphal density fields.
