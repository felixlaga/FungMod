  source_page: additional_file_5.pdf, page 1, embedded raster images
  source_series: 'Figure S5: eight panels, four series each, 62 hourly markers per series'
  axis_calibration:
    method: equally spaced grey gridlines at the declared tick values, least-squares line per axis; the
      x frame is padded and carries no value, the y zero is verified against the frame bottom
    x_ticks: 10 to 60 h in steps of 10 h
    y_ticks: 2000 to 8000 dimensionless in steps of 2000
    panels:
    - panel_index: 0
      family: temperature
      fixed_value: 30
