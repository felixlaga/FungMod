validation:
  expected_columns:
  - time_h
  - tip_count
  - tip_count_sd
  - panel_difference
  - digitization_uncertainty
  - temperature_panel_value
  - humidity_panel_value
  - flags
  allow_missing_uncertainty: true
notes: Literature-processed colony growth curves of Rhizoctonia solani AG4-HG-I S010-1 (number of hyphal
  tips) over a temperature-humidity grid, extracted for the spatial mycelium core. They support calibration
  and held-out prediction across conditions within one study under a frozen plan; they do not validate
  any model on their own, do not transfer to submerged culture or other strains, and the area and tip
  count need a declared observation operator before comparison with hyphal density fields.
