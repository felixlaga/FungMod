measurement_definitions:
  measured_quantity: number of hyphal tips
  units: dimensionless
  uncertainty_definition: 'Standard deviation of the four replicates as plotted by the source, read from
    the error-bar caps; empty where the bar could not be read (flags sd_below_marker_radius, sd_unavailable).
    Digitization resolution: one pixel is 24.47 dimensionless in the coarsest panel; a standard deviation
    smaller than the marker radius (54.88 to 61.17 dimensionless) is hidden behind the marker and cannot
    be read.'
  measurement_method: Hourly flatbed scans of Petri dishes in a climate cabinet for 62 h; the colony network
    was extracted by line detection and converted to a graph from which the mycelial area and the number
    of tips were computed (Vidal-Diez de Ulzurrun et al. 2015); the mean of four replicates is plotted
    per hour.
preprocessing:
  status: raw_figure_digitization_with_panel_cross_check
  raw_data_available: false
  steps:
  - verified the SHA-256 of the article and the five additional files
  - extracted the embedded raster images of the supplementary PDF page in object order and verified their
    count and pixel sizes
  - verified that the two legend images carry the four series hues in the declared label order
  - located the plot frame and the grey gridlines inside it, kept the equally spaced subset of the candidates,
    fitted each axis through them at the declared tick values with a residual below one pixel, and verified
    that the fitted y zero lies on the frame bottom
  - classified pixels into the four series by hue, estimated the shared marker radius from unoccluded
    discs
  - located markers with a disc template that penalises background under the template, so partly hidden
    discs still yield their centre
  - estimated each series' horizontal stagger from its own markers and assigned hours from the de-staggered
    position, excluding markers that fit no hour
  - read each error bar along the marker column through occluding series, accepting an end only where
    its cap is visible
  - converted pixel positions to values with the fitted axes, without smoothing, interpolation or fitting
  - merged the two appearances of every condition (temperature panel and humidity panel) as their mean,
    storing both values and their difference
  - 'checked the article''s prose statements against the merged values: the optimal conditions at 62 h,
    and the equal final R. solani area at 65 percent RH for 15 and 20 C reached earlier at 20 C'
  unit_conversions:
  - time_h = (marker_x_px - x_zero_px) / x_px_per_hour, then de-staggered and rounded to the hour
  - tip_count = (y_zero_px - marker_y_px) / y_px_per_unit, averaged over the two panels
  - tip_count_sd = half the distance between the visible bar caps / y_px_per_unit
  excluded_points:
  - temperature_c: 15
    relative_humidity_percent: 75
    time_h: 2
    reason: marker not found in either panel
  - temperature_c: 20
    relative_humidity_percent: 65
    time_h: 1
    reason: marker not found in either panel
  - temperature_c: 20
    relative_humidity_percent: 65
    time_h: 3
    reason: marker not found in either panel
  - temperature_c: 20
    relative_humidity_percent: 65
    time_h: 4
    reason: marker not found in either panel
  - temperature_c: 20
    relative_humidity_percent: 80
    time_h: 1
    reason: marker not found in either panel
  - temperature_c: 30
    relative_humidity_percent: 75
    time_h: 1
    reason: marker not found in either panel
  - temperature_c: 30
    relative_humidity_percent: 75
    time_h: 2
    reason: marker not found in either panel
  notes: No value was interpolated, smoothed or filled. Hours at which no marker could be located in either
    panel are listed under excluded_points and are absent from the CSV. Flags on every row name the reading
    limitations; the flag glossary is under digitization.flag_glossary. The value stored is the mean of
    the two panel readings; the two readings and their difference are kept as columns.
