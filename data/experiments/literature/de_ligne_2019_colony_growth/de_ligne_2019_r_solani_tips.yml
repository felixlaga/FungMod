kind: experiment_dataset
dataset_id: de_ligne_2019_r_solani_tips_v1
name: De Ligne 2019 number of hyphal tips of Rhizoctonia solani AG4-HG-I S010-1 under sixteen temperature
  and humidity conditions, Figure S5
maturity: literature_processed
source:
  type: literature
  citation: De Ligne L, Vidal-Diez de Ulzurrun G, Baetens JM, Van den Bulcke J, Van Acker J, De Baets
    B. Analysis of spatio-temporal fungal growth dynamics under different environmental conditions. IMA
    Fungus. 2019;10:7.
  doi: 10.1186/s43008-019-0009-3
  url: https://imafungus.biomedcentral.com/articles/10.1186/s43008-019-0009-3
  authors:
  - Liselotte De Ligne
  - Guillermo Vidal-Diez de Ulzurrun
  - Jan M. Baetens
  - Jan Van den Bulcke
  - Joris Van Acker
  - Bernard De Baets
  year: 2019
  figure_or_table: 'Additional file 5: Figure S5, eight panels'
  extraction_method: Raster figure digitization of the panels embedded in the supplementary PDF
  extraction_tool: scripts/digitize_de_ligne_2019_figures.py with numpy 2.4.6, scipy 1.17.1, Pillow 12.3.0,
    pypdfium2 5.14.0
  extracted_by: Claude (Anthropic) for FungMod
  extraction_date: '2026-10-06'
  raw_units:
    time: hour
    value: dimensionless
    uncertainty: dimensionless
  license: CC BY 4.0
  notes: 'Open access under CC BY 4.0. The article''s additional files were downloaded by the repository
    owner and preserved under data/experiments/source_intake/de_ligne_2019 with their SHA-256 digests;
    the development container cannot reach the publisher. The source plots the mean of four replicates
    with standard-deviation bars at every hour; individual replicates are not published (data available
    from the authors on request). LITERATURE_PROCESSED: these are the authors'' per-condition means read
    from figures, not raw replicate measurements. All sixteen conditions of one species come from one
    laboratory, one experiment and one figure; agreement between them is within-study transfer, not independent
    replication.'
system:
  organism: Rhizoctonia solani AG4-HG-I S010-1
  enzyme: null
  substrate: 'inert surface: the bottom lid of a polystyrene Petri dish, inoculated with a 1 cm agar disc
    cut from the periphery of a 3-day mother culture on malt extract agar; the lids restrict the height
    to 0.6 mm'
  product: null
  environment: climate cabinet at the stated temperature and relative humidity; imaged hourly on a flatbed
    scanner
  geometry: two-dimensional colony on a flat surface, 2125 x 2125 pixel scans of about 4 x 4 cm around
    the inoculum
  notes: 'The quantity is extracted by the authors'' image analysis (Vidal-Diez de Ulzurrun et al. 2015):
    a line-detection ridge map converted to a graph whose nodes are hyphal junctions and tips. Mycelial
    area and tip count are graph-derived colony measures, not biomass; the inoculum disc was removed digitally,
    so growth on the agar disc is not captured. The scan window limits the measurable colony; the authors
    report that expansion was limited after 62 h.'
