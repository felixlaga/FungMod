kind: fungmod_fungal_beta_glucosidase_showcase
name: Five purified fungal beta-glucosidases on cellobiose
schema_version: "1"
maturity: literature_reported_exploratory_model_input
provenance:
  source: Bohlin et al. (2010), A comparative study of activity and apparent inhibition of fungal beta-glucosidases.
  primary_doi: https://doi.org/10.1002/bit.22885
  primary_pubmed: https://pubmed.ncbi.nlm.nih.gov/20677177/
  transcription_source: Teugjas and Valjamae (2013), Table 5.
  transcription_doi: https://doi.org/10.1186/1754-6834-6-105
  transcription_pmc: https://pmc.ncbi.nlm.nih.gov/articles/PMC3726394/
  measurement_method: Literature transcription of purified-enzyme kinetic parameters reported for matched cellobiose assays.
  confidence_level: literature_reported
  notes: >
    The open Table 5 transcription attributes these five rows to Bohlin et al.
    (2010). Values are model inputs, not validation observations. Parameter
    uncertainty was not transcribed and therefore remains explicitly unknown.
  validity_range: Purified fungal beta-glucosidases assayed on cellobiose at 50 degrees C and pH 5.
  units: not_applicable
reaction:
  substrate: cellobiose
  product: beta-D-glucose
  enzyme_class: beta-glucosidase
  process_type: homogeneous_michaelis_menten
  inhibition_modifier: competitive_inhibition
  stoichiometric_product_yield: 2.0
  source: https://doi.org/10.1002/bit.22885
  assumptions:
    - Cellobiose and glucose are represented as dissolved, well-mixed concentration states.
    - One cellobiose consumed releases two glucose concentration equivalents.
    - Glucose competitively inhibits the same purified beta-glucosidase that catalyzes cellobiose hydrolysis.
  limitations:
    - The reduced law omits transglycosylation even though fungal beta-glucosidases can catalyze it.
    - Enzyme inactivation, adsorption, secretion, uptake, growth, transport, and spatial gradients are not represented.
    - These are purified-enzyme source-organism labels, not whole-fungus simulations.
scenario:
  maturity: explicit_exploratory_scenario
  allowed_use: Matched-dose comparison of conditional model trajectories only.
  ranking_allowed: false
  ranking_blocking_reason: >
    No empirical time-course validation, parameter uncertainty, whole-fungus
    physiology, or model-discrepancy estimate is available.
  initial_cellobiose:
    value: 10.0
    units: millimole / liter
    source: Explicit FungMod showcase scenario assumption.
  initial_glucose:
    value: 0.0
    units: millimole / liter
    source: Explicit FungMod showcase scenario assumption.
  beta_glucosidase_concentration:
    value: 0.00001
    units: millimole / liter
    display_value: 10
    display_units: nanomole / liter
    source: Explicit standardized comparison dose; not reported by Bohlin et al. (2010).
  temperature:
    value: 323.15
    units: kelvin
    display_value: 50
    display_units: degree_Celsius
    source: Bohlin et al. (2010) matched assay condition.
  ph:
    value: 5.0
    units: dimensionless
    source: Bohlin et al. (2010) matched assay condition.
  time:
    start: 0.0
    stop: 7200.0
    points: 241
    units: second
