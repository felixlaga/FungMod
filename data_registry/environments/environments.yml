      environment_effect_status: metadata_only
      notes: User-specified virtual-experiment context; no pH or temperature response law is applied.
    conditions:
      temperature:
        kind: exact
        value: 303.15
        units: kelvin
        source: user-supplied exploratory condition
        confidence_level: exploratory_assumption
        notes: Assay-context temperature for BIO-001 virtual experiment; not used by a calibrated response model.
      ph:
        kind: exact
        value: 5.0
        units: dimensionless
        source: user-supplied exploratory condition
        confidence_level: exploratory_assumption
        notes: Assay-context pH for BIO-001 virtual experiment; not used by a calibrated response model.
      oxygen_concentration:
        kind: not_applicable
        units: null
        source: FungMod BIO-001 controlled virtual-experiment scaffold.
        confidence_level: exploratory_assumption
        notes: Oxygen limitation is not represented in the enzyme-mediated surface-degradation pilot.
    notes: BIO-001 context only; environment is metadata and does not modify kinetics.

  - record_id: sabiork_reaction_618_selected_conditions
