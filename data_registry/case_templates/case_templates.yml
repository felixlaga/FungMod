              catalytic_parameters: []
              adsorption_parameters: []
              parameters: []
      state_species:
        solid_cellulose_equivalent_concentration:
          species: cellulose_film_generic
          entity_type: substrate
        cellobiose_concentration:
          species: cellobiose
          entity_type: substrate
        cellulase_concentration:
          species: cellulase_generic
          entity_type: enzyme
        beta_glucosidase_concentration:
          species: beta_glucosidase
          entity_type: enzyme
      parameter_record_ids:
        solid_substrate_initial_concentration: bio002_initial_solid_cellulose_equivalent_concentration
        cellulase_initial_concentration: bio002_cellulase_initial_concentration
        beta_glucosidase_initial_concentration: bio002_beta_glucosidase_initial_concentration
        surface_rate_constant: bio002_cellulose_to_cellobiose_surface_rate
        adsorption_constant: bio002_cellulase_adsorption_constant
        accessible_surface_area: bio002_cellulose_accessible_surface_area
        km: sabiork_reaction_618_Km_cellobiose
        kcat: sabiork_reaction_618_kcat_cellobiose
      parameter_role_contracts:
        solid_substrate_initial_concentration:
          kind: initial_state
          parameter_symbol: bio002_initial_solid_cellulose_equivalent_concentration
          record_process_type: extracellular_enzyme_chain
          enzyme_class: null
          substrate_class: cellulose_film_generic
          fungus_id: null
          substrate_id: cellulose_film_generic
          environment_id: sabiork_reaction_618_selected_conditions
        cellulase_initial_concentration:
          kind: initial_state
          parameter_symbol: bio002_cellulase_initial_concentration
          record_process_type: surface_catalysis
          enzyme_class: cellulase_generic
          substrate_class: cellulose_film_generic
          fungus_id: null
          substrate_id: cellulose_film_generic
          environment_id: sabiork_reaction_618_selected_conditions
        beta_glucosidase_initial_concentration:
          kind: initial_state
          parameter_symbol: bio002_beta_glucosidase_initial_concentration
          record_process_type: extracellular_enzyme_chain
          enzyme_class: beta_glucosidase
          substrate_class: cellobiose
          fungus_id: null
          substrate_id: cellobiose
          environment_id: sabiork_reaction_618_selected_conditions
        surface_rate_constant:
          kind: process_parameter
          parameter_symbol: bio002_cellulose_to_cellobiose_surface_rate
          enzyme_class: cellulase_generic
          substrate_class: cellulose_film_generic
          fungus_id: null
          substrate_id: cellulose_film_generic
          environment_id: sabiork_reaction_618_selected_conditions
        adsorption_constant:
          kind: process_parameter
          parameter_symbol: bio002_cellulase_adsorption_constant
          enzyme_class: cellulase_generic
          substrate_class: cellulose_film_generic
          fungus_id: null
          substrate_id: cellulose_film_generic
          environment_id: sabiork_reaction_618_selected_conditions
        accessible_surface_area:
          kind: process_parameter
          parameter_symbol: bio002_cellulose_accessible_surface_area
          enzyme_class: cellulase_generic
          substrate_class: cellulose_film_generic
          fungus_id: null
          substrate_id: cellulose_film_generic
          environment_id: sabiork_reaction_618_selected_conditions
        km:
          kind: process_parameter
          parameter_symbol: Km_cellobiose
          enzyme_class: beta_glucosidase
          substrate_class: cellobiose
          fungus_id: sabiork_beta_glucosidase_source
          substrate_id: cellobiose
          environment_id: sabiork_reaction_618_selected_conditions
        kcat:
          kind: process_parameter
          parameter_symbol: kcat_cellobiose
          enzyme_class: beta_glucosidase
          substrate_class: cellobiose
          fungus_id: sabiork_beta_glucosidase_source
          substrate_id: cellobiose
          environment_id: sabiork_reaction_618_selected_conditions
      product_maps:
        - id: bio002_cellulose_to_cellobiose_map
          name: BIO-002 cellulose-equivalent to cellobiose release map
          product_map_type: stoichiometric
          reactants:
            substrate: 1.0
          products:
            intermediate: 1.0
          notes: One cellulose-equivalent cleavage unit releases one cellobiose-equivalent intermediate.
        - id: bio002_cellobiose_to_glucose_map
          name: BIO-002 cellobiose to beta-D-glucose map
          product_map_type: stoichiometric
          reactants:
            intermediate: 1.0
          products:
            product: 2.0
          notes: Reuses the Reaction 618 stoichiometric glucose yield.
      process_templates:
        - id: bio002_surface_cellulose_to_cellobiose
          process_type: surface_catalysis
          state_roles:
            substrate: substrate
            catalyst: surface_catalyst
            product: intermediate
          fixed_states:
            bond_type: beta_1_4_glycosidic
            accessible_site_pool: cellulose beta-1,4-glycosidic accessible surface
          parameter_roles:
            surface_rate_constant: surface_rate_constant
            adsorption_constant: adsorption_constant
            accessible_surface_area: accessible_surface_area
          fixed_parameters:
            rate_units: mM / second
          product_map: bio002_cellulose_to_cellobiose_map
          assumptions:
            - Solid cellulose-like substrate is represented as an explicit cellobiose-equivalent concentration pool.
            - Accessible surface area is constant during each run; surface renewal and morphology are not modeled.
        - id: bio002_cellobiose_to_glucose_mm
          process_type: homogeneous_michaelis_menten
          state_roles:
            substrate: intermediate
            product: product
            enzyme: homogeneous_catalyst
          parameter_roles:
            km: km
            kcat: kcat
          fixed_parameters:
            rate_units: mM / second
          product_map: bio002_cellobiose_to_glucose_map
          assumptions:
            - Dissolved cellobiose hydrolysis uses the generic homogeneous Michaelis-Menten process.
            - Stoichiometric product dynamics use two glucose equivalents per cellobiose consumed.
      conservation:
        id: cellobiose_equivalent_balance
        closed_system: true
        state_weights:
          substrate: 1.0
          intermediate: 1.0
          product: 0.5
      chain_outputs:
        state_series:
          - role: substrate
            label: solid_substrate_remaining
          - role: intermediate
            label: cellobiose
          - role: product
            label: glucose
          - role: surface_catalyst
            label: cellulase
          - role: homogeneous_catalyst
            label: beta_glucosidase
        derived_series:
          - id: degraded_fraction
            kind: fractional_depletion
            role: substrate
            label: solid_substrate_degraded_fraction
            units: dimensionless
            threshold_fractions:
              - 0.1
              - 0.5
              - 0.9
            notes: Fraction of the initial cellulose-equivalent substrate pool consumed.
          - id: product_yield
            kind: conserved_equivalent_fraction
            role: product
            denominator_role: substrate
            label: glucose_yield
            units: dimensionless
            notes: Product converted to substrate-equivalent units using declared conservation weights.
        final_metrics:
          - id: final_substrate_remaining
            kind: final_state
            role: substrate
            label: solid_substrate_remaining
          - id: final_intermediate
            kind: final_state
            role: intermediate
            label: cellobiose
          - id: final_product
            kind: final_state
            role: product
            label: glucose
          - id: final_degraded_fraction
            kind: final_derived
            derived_series: degraded_fraction
            label: solid_substrate_degraded_fraction
          - id: final_product_yield
            kind: final_derived
            derived_series: product_yield
            label: final_glucose_yield
        process_rate_metrics:
          include_maximum: true
      suggested_experiments:
        - id: bio002_timecourse_cellobiose_glucose
          priority: high
          description: Measure solid-substrate loss, cellobiose, and glucose over time for an extracellular enzyme mixture.
          rationale: Needed to calibrate or validate the linked surface-release and homogeneous hydrolysis steps together.
        - id: bio002_accessible_surface_area
          priority: medium
          description: Independently estimate accessible cellulose surface area for the assay material.
          rationale: Surface release remains exploratory until accessible area is measured or constrained.
    limitations:
      - Reusable extracellular enzyme-chain mechanism only; not whole-fungus growth, secretion, uptake, or biomass.
      - Solid cellulose-like substrate is represented as a cellobiose-equivalent concentration pool, not full cellulose morphology.
      - Accessible surface area is constant; surface renewal, crystallinity, pore transport, and morphology evolution are not modeled.
      - The first step uses exploratory scaffold parameters; only the cellobiose-to-glucose kinetic constants come from the local Reaction 618 registry records.
      - No PET, lignin, full lignocellulose, organism-specific physiology, or environmental response law is represented.
    validity_notes:
      - BIO-002 demonstrates reusable process assembly and stoichiometric product dynamics, not experimental validation.
      - Parameter values are suitable for exploratory software exercising and hypothesis generation only unless separately calibrated.
    notes: >
      Template describes a reusable extracellular enzyme chain assembled from
      generic surface catalysis and homogeneous Michaelis-Menten process laws.

