          measurement_method: reported reactor operating condition
          confidence_level: literature_curated
          notes: 3 L stirred bioreactor (BioFlo 115) with 1.9 L working volume, 200-300 rpm, 0.48-0.7 vvm; treated as well mixed with no spatial gradients.
