          name: Cellulose consumption to biomass with an explicit yield and a closure ledger
          product_map_type: stoichiometric
          reactants:
            substrate: 1.0
          products:
            biomass:
              parameter_role: biomass_yield
            ledger_unassimilated_substrate:
              complement_of_parameter_role: biomass_yield
          notes: >-
            One gram of consumed cellulose forms Y gram of biomass dry mass; the
            remaining (1 - Y) gram is booked to an explicit ledger of consumed
            cellulose not retained as biomass (respired carbon, soluble products and
            secreted protein were not measured). The ledger closes the dry-mass balance.
      process_templates:
        - id: cellulase_limited_cellulose_consumption
          process_type: homogeneous_michaelis_menten
          state_roles:
            substrate: substrate
            enzyme: enzyme
            product: biomass
          parameter_roles:
            kcat: hydrolysis_capacity
            km: hydrolysis_half_saturation
          fixed_parameters:
            rate_units: gram / liter / hour
          product_map: cellulose_conversion_with_biomass_yield
          assumptions:
            - Bulk cellulose consumption is proportional to measured filter-paper activity and saturates in cellulose (consumption = k_h F S / (K_h + S)).
            - Consumed cellulose is converted to biomass with a constant explicit yield; soluble intermediates are not resolved.
        - id: biomass_loss
          process_type: first_order
          state_roles:
            source: biomass
            product: ledger_biomass_loss
          parameter_roles:
            rate_constant: biomass_loss_rate
          assumptions:
            - Biomass dry mass is lost at a constant first-order rate into an explicit ledger pool; no viability, lysis or death mechanism is claimed.
        - id: cellulase_synthesis
          process_type: proportional_synthesis
          state_roles:
            producer: biomass
            inducer: substrate
            product: enzyme
          parameter_roles:
            specific_rate: cellulase_specific_production_rate
            induction_half_saturation: induction_half_saturation
          fixed_parameters:
            rate_units: filter_paper_unit / liter / hour
          assumptions:
            - Filter-paper activity is produced in proportion to biomass and saturably induced by cellulose (production = qF X S / (K_ind + S)); the material cost of production is not represented.
        - id: cellulase_loss
          process_type: first_order
          state_roles:
            source: enzyme
          parameter_roles:
            rate_constant: cellulase_loss_rate
          assumptions:
            - Filter-paper activity is lost at a constant first-order rate; no inactive protein pool is represented for an assay activity.
        - id: beta_glucosidase_synthesis
          process_type: proportional_synthesis
          state_roles:
            producer: biomass
            inducer: substrate
            product: enzyme_beta_glucosidase
          parameter_roles:
            specific_rate: beta_glucosidase_specific_production_rate
            induction_half_saturation: induction_half_saturation
          fixed_parameters:
            rate_units: beta_glucosidase_assay_unit / liter / hour
          assumptions:
            - Beta-glucosidase activity is produced in proportion to biomass with the same saturable cellulose induction as filter-paper activity; it has no feedback on cellulose consumption in this candidate.
        - id: beta_glucosidase_loss
          process_type: first_order
          state_roles:
            source: enzyme_beta_glucosidase
          parameter_roles:
            rate_constant: beta_glucosidase_loss_rate
          assumptions:
            - Beta-glucosidase activity is lost at a constant first-order rate.
      conservation:
        id: dry_mass_closure_ledger
        closed_system: true
        state_weights:
          substrate: 1.0
          biomass: 1.0
          ledger_unassimilated_substrate: 1.0
          ledger_biomass_loss: 1.0
      suggested_experiments:
        - id: gelain_replicate_level_time_courses
          priority: high
          description: Obtain individual replicate time courses (not duplicate means) of biomass, cellulose, filter-paper and beta-glucosidase activity for at least one held-out cellulose loading.
          rationale: Replicate-level data with a measured error model are required before any calibrated constant can be promoted beyond a retrospective fit.
        - id: induction_and_activity_loss_identifiability
          priority: high
          description: Measure activity production at cellulose concentrations below 1 g/L and activity decay in cell-free broth.
          rationale: The induction constant and both activity-loss constants sit at their fitting bounds; the published means do not identify them.
    limitations:
      - Well-mixed batch culture of one strain on one particulate cellulose; nutrient, oxygen, maintenance, pH and morphology dynamics are not represented.
      - Enzyme pools are assay activities (FPU per litre, beta-glucosidase units per litre); they are not converted to enzyme mass or molarity.
      - Consumed cellulose not retained as biomass is an explicit closure ledger, not a measured product; soluble sugars and respired carbon were not measured.
      - Calibrated constants are retrospective fits to published duplicate means without measured uncertainty; the induction constant and both activity-loss constants sit at fitting bounds.
      - Temperature and pH are controlled set points recorded as metadata; no environmental response law is applied.
    validity_notes:
      - The case is exact and implemented with current registry records; it is not an experimentally validated prediction of T. harzianum physiology.
      - Scope is T. harzianum P49P11 on Celufloc 200 cellulose at 10-30 g/L, 29 C, pH 5.0, dissolved oxygen above 30 percent, 0-96 h.
    notes: >-
      Culture-physiology template composing the Gelain 2020 hydrolysis candidate
      from generic process laws. It names roles only; organism identity, constants
      and initial conditions come from the bound registry records.

  - record_id: phanerochaete_bgl1a_cellobiose_ph_ionization_template
    case_template_id: phanerochaete_bgl1a_cellobiose_ph_ionization_template
    name: P. chrysosporium BGL1A cellobiose pH-dependent Michaelis-Menten assembly template
    maturity: literature_metadata
    provenance:
      source: SABIO-RK Reaction 618 kinetic-law entry 38522 (Tsukada et al. 2008, PMID 18023045)
      source_database: SABIO-RK
      source_reaction_id: "618"
      selected_kinlaw_entry_id: "38522"
      confidence_level: literature_metadata
      notes: Assembly metadata for the BGL1A pH-response case; it creates no parameter evidence.
    schema_version: "1"
    process_type: ph_ionization_michaelis_menten
    state_roles:
      substrate: cellobiose_concentration
      product: beta_D_glucose_concentration
      enzyme: bgl1a_concentration
    initial_state_mapping:
      substrate:
        parameter_role: substrate_initial_concentration
        units_from_role: substrate_initial_concentration
      product:
        value: 0.0
        units_from_role: substrate_initial_concentration
      enzyme:
        parameter_role: enzyme_initial_concentration
        units_from_role: enzyme_initial_concentration
    product_map:
      id: phanerochaete_bgl1a_cellobiose_product_map
      product_map_type: stoichiometric
      substrate_state_role: substrate
      product_state_role: product
      stoichiometric_yield: 2.0
      notes: Reaction 618 stoichiometry (cellobiose + H2O -> 2 beta-D-glucose).
    stoichiometric_yields:
      product: 2.0
    time_grid:
      start: 0.0
      stop: 14400.0
      points: 145
      units: second
    observable_roles:
      - substrate
      - product
      - enzyme
      - degradation_rate
      - product_release_rate
    output_state_roles:
      substrate: cellobiose_concentration
      product: beta_D_glucose_concentration
      enzyme: bgl1a_concentration
    process_state_metadata:
      config_name: "P. chrysosporium BGL1A cellobiose pH-dependent Michaelis-Menten (Tsukada 2008 via SABIO-RK)"
      config_mode: scientific
      config_maturity: scientific
      process_id: phanerochaete_bgl1a_ph_ionization_mm
      parameter_set_id: phanerochaete_bgl1a_parameters
      product_map_name: BGL1A cellobiose to beta-D-glucose product map
      public_path: true
    limitations:
      - Dissolved homogeneous Michaelis-Menten kinetics with the source-fitted diprotic pH dependence of kcat and Km; pH is read once from the environment.
      - This is an enzyme-kinetics case for recombinant BGL1A, not a whole-fungus growth, secretion, uptake, or wood-decay model.
      - The assay substrate and enzyme loadings are explicit exploratory assumptions because SABIO-RK entry 38522 records no concentrations; the case therefore runs in exploratory mode only.
      - Temperature is the 30 C set point of the source; no temperature response law is bound, so temperature stays metadata and cases at other temperatures cannot be ranked by temperature.
    validity_notes:
      - The pH law was fitted over pH 4-8 in four buffers (sodium acetate, MES, HEPES, EPPS); the bound pH-range roles make cases outside that range warn rather than fail.
      - The 2:1 glucose yield is reaction stoichiometry; the source reports initial rates, not product time courses.
    notes: >
      Template describing how the BGL1A pH-response registry case is assembled.
      It does not fetch SABIO-RK data and does not create parameter evidence.
