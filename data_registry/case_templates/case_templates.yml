  - record_id: bio001_cellulose_surface_catalysis_template
    case_template_id: bio001_cellulose_surface_catalysis_template
    name: BIO-001 cellulose surface-catalysis assembly template
    maturity: exploratory_metadata
    provenance:
      source: FungMod BIO-001 controlled virtual-experiment scaffold.
      confidence_level: exploratory_assumption
      bio_milestone: BIO-001
      notes: Assembly metadata for the existing BIO-001 enzyme-mediated cellulose surface-degradation pilot.
    schema_version: "1"
    process_type: surface_catalysis
    state_roles:
      substrate: solid_substrate_remaining
      product: soluble_product_amount
      catalyst: free_enzyme_concentration
      accessibility_proxy: accessible_site_fraction_remaining_proxy
    initial_state_mapping:
      substrate:
        parameter_role: substrate_initial_amount
        units_from_role: substrate_initial_amount
      product:
        value: 0.0
        units_from_role: substrate_initial_amount
      catalyst:
        parameter_role: enzyme_initial_concentration
        units_from_role: enzyme_initial_concentration
    product_map:
      id: bio001_cellulose_surface_release_map
      product_map_type: one_to_one
      substrate_state_role: substrate
      product_state_role: product
      stoichiometric_yield: 1.0
      notes: Mass-equivalent soluble product release map for BIO-001; not full cellulose stoichiometry.
    stoichiometric_yields:
      product: 1.0
    time_grid:
      start: 0.0
      stop: 4000.0
      points: 81
      units: second
    observable_roles:
      - substrate
      - product
      - accessibility_proxy
      - degradation_rate
      - product_release_rate
    output_state_roles:
      substrate: solid_substrate_remaining
      product: soluble_product_amount
      enzyme: free_enzyme_concentration
      accessibility_proxy: accessible_site_fraction_remaining_proxy
    process_state_metadata:
      config_name: "BIO-001 cellulose surface virtual experiment {fungus_id} on {substrate_id}"
      config_mode: exploratory
      config_maturity: exploratory
      public_path: true
      bond_type: beta_1_4_glycosidic
      accessible_site_pool: cellulose accessible beta-1,4-glycosidic surface
      product_map_name: BIO-001 cellulose soluble product release map
      config_provenance:
        source: FungMod BIO-001 controlled virtual-experiment scaffold.
        measurement_method: registry assembly from user-supplied exploratory ValueSpec samples
        confidence_level: exploratory_assumption
        validity_range: BIO-001 cellulose surface-degradation pilot only
        units: not_applicable
        bio_milestone: BIO-001
        notes: >-
          Exploratory enzyme-mediated insoluble cellulose surface-degradation
          pilot. It is not a whole-fungus model and does not include secretion,
          uptake, biomass growth, oxygen limitation, or full lignocellulose
          structure.
      substrate_entity:
        notes: Generic insoluble cellulose-like film metadata for BIO-001 surface degradation.
        product_notes: >-
          BIO-001 soluble cellulose hydrolysis-product class; not a full
          stoichiometric speciation model.
        completeness: partial
        default_degradation_model: heterogeneous_surface
        water_activity_dependence: unknown
      enzyme_entity:
        name: Generic cellulase-like enzyme source
        validity_labels:
          - exploratory_metadata
          - surface_catalysis
          - enzyme_mediated_cellulose_degradation
        notes: >-
          Generic cellulase-like enzyme metadata for BIO-001. This does not
          model secretion, uptake, biomass growth, or enzyme inactivation.
      parameter_entries:
        measurement_method: sampled from user-supplied exploratory registry ValueSpec
        validity_range: BIO-001 cellulose surface-degradation pilot only
      geometry:
        kind: geometry
        name: BIO-001 well-mixed enzyme assay context
        geometry_type: well_mixed
        provenance:
          source: FungMod BIO-001 controlled virtual-experiment scaffold.
          measurement_method: user-specified virtual-experiment context
          confidence_level: exploratory_assumption
          notes: Geometry context for an enzyme-mediated surface-degradation pilot; no spatial gradients are modeled.
          validity_range: BIO-001 cellulose surface-degradation pilot only
          units: not_applicable
        volume:
          value: 100.0
          units: milliliter
        surface_area:
          value: 0.5
          units: meter ** 2
        parameters: []
    limitations:
      - Enzyme-mediated insoluble cellulose surface degradation pilot.
      - Accessible surface area is constant within each sample; surface renewal and morphology are not modeled.
      - Soluble product release is represented by a mass-equivalent product class.
    validity_notes:
      - BIO-001 does not model whole-fungus growth, secretion, uptake, biomass, oxygen limitation, or lignocellulose structure.
      - Time-grid values preserve the pre-ASSEMBLY-001 runtime defaults for existing BIO-001 tests and outputs.
    notes: >
      Template describes BIO-001 assembly only. It does not provide evidence
      for parameter values or scientific validity beyond the linked registry
      records and explicit exploratory priors.

  - record_id: sabiork_reaction_618_homogeneous_mm_template
    case_template_id: sabiork_reaction_618_homogeneous_mm_template
    name: SABIO-RK Reaction 618 homogeneous Michaelis-Menten assembly template
    maturity: literature_metadata
    provenance:
      source: SABIO-RK Reaction 618 selected kinetic law
      source_database: SABIO-RK
      source_reaction_id: "618"
      selected_kinlaw_entry_id: "35622"
      confidence_level: literature_metadata
      notes: Assembly metadata for the existing local Reaction 618 beta-glucosidase cellobiose kinetic pilot.
    schema_version: "1"
    process_type: homogeneous_michaelis_menten
    state_roles:
      substrate: cellobiose_concentration
      product: beta_D_glucose_concentration
      enzyme: beta_glucosidase_concentration
    initial_state_mapping:
      substrate:
        parameter_role: substrate_initial_concentration
        units_from_role: substrate_initial_concentration
      product:
        value: 0.0
        units_from_role: substrate_initial_concentration
      enzyme:
        parameter_role: enzyme_initial_concentration
        units_from_role: enzyme_initial_concentration
    product_map:
      id: sabiork_reaction_618_product_map
      product_map_type: stoichiometric
      substrate_state_role: substrate
      product_state_role: product
      stoichiometric_yield: 2.0
      notes: Reaction 618 stoichiometry; homogeneous product dynamics use this 2:1 glucose yield.
    stoichiometric_yields:
      product: 2.0
    time_grid:
      start: 0.0
      stop: 1000.0
      points: 101
      units: second
    observable_roles:
      - substrate
      - product
      - enzyme
      - degradation_rate
      - product_release_rate
    output_state_roles:
      substrate: cellobiose_concentration
      product: beta_D_glucose_concentration
      enzyme: beta_glucosidase_concentration
    process_state_metadata:
      config_name: "SABIO-RK Reaction 618 beta-glucosidase cellobiose homogeneous Michaelis-Menten"
      config_mode: scientific
      config_maturity: scientific
      process_id: sabiork_reaction_618_homogeneous_mm
      parameter_set_id: sabiork_reaction_618_parameters
      product_map_name: SABIO-RK Reaction 618 cellobiose to beta-D-glucose product map
      public_path: true
    limitations:
      - Dissolved homogeneous Michaelis-Menten kinetics for the selected SABIO-RK entry.
      - This is an enzyme-kinetics case, not a whole-fungus growth or uptake model.
      - Stoichiometric yield drives product formation, but this remains an enzyme-kinetics case without growth or uptake.
    validity_notes:
      - Template metadata does not resolve the missing selected-entry enzyme concentration.
      - Time-grid values preserve the pre-ASSEMBLY-001 runtime defaults for existing Reaction 618 tests and outputs.
    notes: >
      Template describes how the local Reaction 618 registry case is assembled.
      It does not fetch SABIO-RK data and does not create parameter evidence.

  - record_id: bio002_extracellular_enzyme_chain_template
    case_template_id: bio002_extracellular_enzyme_chain_template
