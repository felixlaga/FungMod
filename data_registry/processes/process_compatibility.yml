    enzyme_class: cellulase_generic
    substrate_class: cellulose_film_generic
    required_bond_classes:
      - beta_1_4_glycosidic
    process_type: extracellular_enzyme_chain
    required_parameters:
      - bio002_initial_solid_cellulose_equivalent_concentration
      - bio002_cellulase_initial_concentration
      - bio002_beta_glucosidase_initial_concentration
      - bio002_cellulose_to_cellobiose_surface_rate
      - bio002_cellulase_adsorption_constant
      - bio002_cellulose_accessible_surface_area
      - Km_cellobiose
      - kcat_cellobiose
    parameter_roles:
      solid_substrate_initial_concentration: bio002_initial_solid_cellulose_equivalent_concentration
      cellulase_initial_concentration: bio002_cellulase_initial_concentration
      beta_glucosidase_initial_concentration: bio002_beta_glucosidase_initial_concentration
      surface_rate_constant: bio002_cellulose_to_cellobiose_surface_rate
      adsorption_constant: bio002_cellulase_adsorption_constant
      accessible_surface_area: bio002_cellulose_accessible_surface_area
      km: Km_cellobiose
      kcat: kcat_cellobiose
    product_map_required: true
    case_template_id: bio002_extracellular_enzyme_chain_template
    component_bindings:
      - process_template_id: bio002_surface_cellulose_to_cellobiose
        compatibility_record_id: bio002_cellulase_cellulose_surface_component
      - process_template_id: bio002_cellobiose_to_glucose_mm
        compatibility_record_id: bio002_beta_glucosidase_cellobiose_component
    notes: >
      CASE-001/BIO-002 compatibility only. It exposes the existing two-step
      enzyme-chain template through registry case selection; it does not add
      whole-fungus growth, secretion, uptake, biomass, PET, lignin, full
      lignocellulose, organism-specific physiology, or empirical validation.

