kind: fungmod_registry_records
record_type: substrates
records:
  - record_id: toy_cellulose_like_solid
    name: Toy cellulose-like solid
    maturity: toy_development
    provenance:
      source: FungMod R1 toy registry fixture.
      confidence_level: testing
      notes: Fake substrate record for loader tests only.
    substrate_class: toy_cellulose_like
    physical_state: toy_solid
    bond_classes:
      - toy_beta_1_4_glycosidic
    products:
      - toy_sugar_product
    properties:
      accessible_surface_area:
        kind: range
        lower: 0.1
        upper: 10.0
        units: meter ** 2 / gram
        source: FungMod toy registry fixture.
        confidence_level: testing
        notes: Artificial range for registry loader tests only.
      roughness_factor:
        kind: exact
        value: 1.0
        units: dimensionless
        source: FungMod toy registry fixture.
        confidence_level: testing
        notes: Artificial exact value for registry loader tests only.
    notes: Toy/development substrate only; not real cellulose data.

  - record_id: cellulose_film_generic
    name: Generic insoluble cellulose film
    display_name: cellulose film
    aliases:
      - cellulose film
      - generic cellulose film
    maturity: exploratory_metadata
    provenance:
      source: FungMod BIO-001 controlled virtual-experiment scaffold.
      confidence_level: exploratory_assumption
      notes: Generic cellulose-like solid substrate metadata for a surface-degradation pilot; not a literature dataset.
    substrate_class: cellulose_film_generic
    physical_state: solid_polymer
    bond_classes:
      - beta_1_4_glycosidic
    products:
      - soluble_cellulose_hydrolysis_product
    properties:
      accessible_surface_area:
        kind: unknown
        units: meter ** 2
        source: user-supplied exploratory range
        confidence_level: exploratory_assumption
        notes: BIO-001 does not provide a literature-curated cellulose-film accessible surface area; simulation uses explicit exploratory parameter records.
      accessible_site_fraction:
        kind: unknown
        units: dimensionless
        source: user-supplied exploratory range
        confidence_level: exploratory_assumption
        notes: Accessible-site fraction is represented in BIO-001 output as a derived proportional proxy, not as an independently calibrated state.
    notes: >
      Generic insoluble cellulose-like film for BIO-001. The record captures
      physical state, beta-1,4-glycosidic bond accessibility metadata, and
      product class only; it does not claim measured surface area,
      crystallinity, pore accessibility, or lignocellulose composition.

  - record_id: cellobiose
    name: Cellobiose
    aliases:
      - cellobiose substrate
      - SABIO-RK Reaction 618 substrate
    maturity: literature_metadata
    provenance:
      source_database: SABIO-RK
      source_reaction_id: "618"
      selected_kinlaw_entry_id: "35622"
      kegg_reaction: R00026
      metanetx: MNXR146826
    substrate_class: cellobiose
    physical_state: dissolved
    bond_classes:
      - beta_1_4_glycosidic
    products:
      - beta_D_glucose
    properties: {}
    notes: Soluble disaccharide substrate for first SABIO-RK kinetic pilot.

  - record_id: cellulose_celufloc_200
    name: Cellulose (Celufloc 200)
    display_name: Celufloc 200 cellulose
    aliases:
      - Celufloc 200
      - Celufloc 200 cellulose
      - cellulose Celufloc 200
    maturity: literature_metadata
    provenance:
      source: >-
        Gelain 2020 Methods 2.2 (doi:10.1016/j.cesx.2020.100085): cellulose
        Celufloc 200 (Celuflok Ind. Com., Brazil) at 5-40 g/L as the inducer
        substrate in Mandels medium with 1 g/L peptone.
      confidence_level: literature_curated
      notes: >-
        Commercial particulate cellulose. The source reports no particle size
        distribution, crystallinity, accessible surface area or purity; those
        properties are recorded as explicit unknowns.
    substrate_class: cellulose_particulate
    physical_state: solid_polymer
    bond_classes:
      - beta_1_4_glycosidic
    products: []
    properties:
      accessible_surface_area:
        kind: unknown
        units: meter ** 2 / gram
        source: Not reported by Gelain 2020.
        confidence_level: missing_from_source
        notes: No surface-area measurement exists in the source; the organism case uses an effective bulk saturation law.
      crystallinity_index:
        kind: unknown
        units: dimensionless
        source: Not reported by Gelain 2020.
        confidence_level: missing_from_source
        notes: Crystallinity was not characterized by the source.
    notes: >-
      Particulate cellulose used as the sole inducer carbon source in the Gelain
      2020 batch cultures. Soluble hydrolysis products were not measured in the
      source; the registry therefore declares no product pool for this substrate
      and the organism case tracks consumed cellulose that is not retained as
      biomass through an explicit closure ledger rather than a product species.

  - record_id: xylan
    name: Generic insoluble xylan
    display_name: xylan
    aliases:
      - generic xylan
    maturity: exploratory_metadata
    provenance:
      source: >-
        Generic polysaccharide definition: a (1->4)-beta-D-xylan backbone, the linkage
        named in the IUBMB Enzyme Nomenclature reaction of EC 3.2.1.8 (endohydrolysis
        of (1->4)-beta-D-xylosidic linkages in xylans). Not a characterized
        preparation.
      confidence_level: generic_class_definition
      notes: >-
        Composition varies by source: natural xylans carry arabinosyl,
        (4-O-methyl-)glucuronosyl and acetyl substituents in proportions that differ
        between plants and preparations, and the insoluble fraction depends on the
        extraction. None of this is represented; the record names the backbone bond
        class only.
    substrate_class: xylan
    physical_state: solid_polymer
    bond_classes:
      - beta_1_4_xylosidic
    products:
      - D_xylose_equivalent
    properties: {}
    notes: >-
      One suspended solid polymer on a dry-mass basis, for the apparent
      Michaelis-Menten route of user data. The product D_xylose_equivalent is the mass
      of D-xylose that the solubilized backbone gives on complete hydrolysis (for
      example measured by HPLC after acid post-hydrolysis); it is not free xylose
      (an endo-xylanase releases mainly xylo-oligosaccharides) and not a
      reducing-sugar (DNS) equivalent, which counts chain ends rather than mass. The
      complete-hydrolysis mass yield of an unsubstituted backbone is the registry
      product map xylan_to_d_xylose_equivalent_mass_yield; a user dataset states its
      own yield. No surface area, crystallinity, particle size or substitution
      pattern is recorded.

  - record_id: starch
    name: Generic solid starch
    display_name: starch
    aliases:
      - generic starch
    maturity: exploratory_metadata
    provenance:
      source: >-
        Generic polysaccharide definition: a mixture of amylose, a linear
        (1->4)-alpha-D-glucan, and amylopectin, a (1->4)-alpha-D-glucan with
        (1->6)-alpha-D-glucosidic branch points; the (1->4) linkage and the (1->6)
        branch points are those named in the IUBMB Enzyme Nomenclature entry of EC
        3.2.1.3. Not a characterized preparation.
      confidence_level: generic_class_definition
      notes: >-
        Composition varies by source: the amylose/amylopectin ratio, branch density,
        granule size and crystallinity, gelatinization state and the lipid and protein
        content differ between botanical sources and preparations. None of this is
        represented; the record names the bond classes only.
    substrate_class: starch
    physical_state: solid_polymer
    bond_classes:
      - alpha_1_4_glycosidic
      - alpha_1_6_glycosidic
    products:
      - beta_D_glucose
    properties: {}
    notes: >-
      One suspended solid polymer (for example raw granules) on a dry-mass basis, for
      the apparent Michaelis-Menten route of user data; amylose and amylopectin are
      both alpha-D-glucans and are not separated. The bond classes are categorical:
      the share of (1->6) branch points is not recorded and no rate depends on it.
      The declared product is beta-D-glucose, the product of glucoamylase (EC
      3.2.1.3), the only registry class acting on starch; other amylolytic
      activities, such as alpha-amylase, release malto-oligosaccharides, which this
      record does not declare. The complete-hydrolysis mass yield is the registry
      product map starch_to_beta_d_glucose_mass_yield; a user dataset states its own
      yield. No surface area, granule size, crystallinity or gelatinization model is
      recorded.

  - record_id: chitin
    name: Generic insoluble chitin
    display_name: chitin
    aliases:
      - generic chitin
    maturity: exploratory_metadata
    provenance:
      source: >-
        Generic polysaccharide definition: a (1->4)-beta-linked polymer of
        N-acetyl-D-glucosamine, the linkage named in the IUBMB Enzyme Nomenclature
        reaction of EC 3.2.1.14 (random endo-hydrolysis of N-acetyl-beta-D-glucosaminide
        (1->4)-beta-linkages in chitin and chitodextrins). Not a characterized
        preparation.
      confidence_level: generic_class_definition
      notes: >-
        Composition varies by source: the degree of acetylation (partly deacetylated
        glucosamine units), the polymorph (alpha or beta chitin), crystallinity and the
        residual protein and mineral of the preparation differ between sources. None
        of this is represented; the record names the bond class only.
    substrate_class: chitin
    physical_state: solid_polymer
    bond_classes:
      - beta_1_4_n_acetylglucosaminidic
    products:
      - N_acetyl_D_glucosamine_equivalent
    properties: {}
    notes: >-
      One suspended solid polymer on a dry-mass basis, for the apparent
      Michaelis-Menten route of user data. The product
      N_acetyl_D_glucosamine_equivalent is the mass of N-acetyl-D-glucosamine that the
      solubilized polymer gives on complete hydrolysis; chitinase releases mainly
      chitobiose and chito-oligosaccharides, so the product is not free
      N-acetyl-D-glucosamine. The complete-hydrolysis mass yield of a fully
      acetylated polymer is the registry product map
      chitin_to_n_acetyl_d_glucosamine_equivalent_mass_yield; a user dataset states
      its own yield. No surface area, crystallinity, polymorph or degree of
      acetylation is recorded.
