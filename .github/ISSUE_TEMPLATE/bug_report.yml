name: Bug report
description: Report a defect or unexpected result in FungMod
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in the
        sections below. For security vulnerabilities, do **not** use this form —
        see [SECURITY.md](https://github.com/felixlaga/FungMod/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: I called `fm.virtual_experiment(...)` and expected ..., but got ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest self-contained code snippet that reproduces the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or output
      description: Paste the complete error, traceback, or wrong output. Do not truncate.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: FungMod version
      description: Output of `python -c "import fungmod; print(fungmod.__version__)"`
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: python-os
    attributes:
      label: Python version and operating system
      description: Output of `python -c "import sys; print(sys.version)"` and your OS.
      placeholder: 3.12.4 on macOS 14.5 (arm64)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration or registry files (if relevant)
      description: If the problem is data-dependent, attach or paste the config/registry files (redact anything confidential).
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am using a supported Python version (3.11–3.13).
          required: true
