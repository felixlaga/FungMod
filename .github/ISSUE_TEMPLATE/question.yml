name: Question
description: Ask a usage or "how do I…?" question (use only if Discussions is disabled)
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        If [Discussions](https://github.com/felixlaga/FungMod/discussions) is
        enabled, please ask there instead. Use this form only if Discussions is
        unavailable. See [SUPPORT.md](https://github.com/felixlaga/FungMod/blob/main/SUPPORT.md)
        for how to ask a good question.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: attempt
    attributes:
      label: What you have tried
      description: Code you have run and documentation you have read.
      render: python
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: FungMod version
      placeholder: 0.1.1
    validations:
      required: false
